<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Ember</title>
  <link rel="stylesheet" href="../shared/ember.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- A click anywhere on it opens Ember's menu; the menu button is the face, so the words stay readable text. -->
  <div id="handle" class="handle">
    <button id="menu" class="menu" type="button" aria-label="Ember menu"><canvas id="face" aria-hidden="true"></canvas></button>
    <!-- The microphone's state: its shape and its name (main.ts sets both; app/shared/mic.ts has the words). -->
    <i id="mic" class="mic" hidden role="img" aria-label="Microphone"></i>
    <span class="text">
      <span class="name-row"><b id="name">Ember</b><span id="target" class="target" hidden><i class="target-dot" aria-hidden="true"></i><span id="target-text"></span></span></span>
      <span id="line">Ready</span>
      <span id="thought" class="thought"></span>
      <span id="step" class="step" hidden></span>
    </span>
  </div>
  <!-- Without a compositor the card is Ember's only surface: screen readers hear its answers and questions here. -->
  <div id="live" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="actions" class="actions" hidden></div>
  <div id="task" class="task" hidden>
    <span class="task-text"><span id="task-state" class="sr"></span><b id="task-title"></b> <span id="task-detail"></span></span>
    <span id="task-actions" class="task-actions"></span>
  </div>
  <script src="main.js"></script>
</body>
</html>
