<!doctype html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember</title>
  <link rel="stylesheet" href="styles.css">
</head>

      <canvas id="buddy" width="132" height="132" aria-label="Your Ember character"></canvas>
