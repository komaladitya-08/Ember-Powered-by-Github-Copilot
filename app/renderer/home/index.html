<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="home">
    <header class="hero">
      <canvas id="buddy" width="132" height="132" aria-label="Your Ember character"></canvas>
      <div class="hero-text">
        <h1>Ember</h1>
        <p id="tagline">Starting…</p>
      </div>
    </header>

    <section class="pick" aria-labelledby="pick-h">
      <h2 id="pick-h">Your Ember</h2>
      <div class="cards" id="cards" role="radiogroup" aria-labelledby="pick-h"></div>
      <div class="pick-row">
        <label for="size">Size <output id="size-out">60 px</output></label>
        <input type="range" id="size" min="36" max="110" step="2" value="60">
        <button type="button" id="start" class="start" hidden>Start Ember</button>
      </div>
      <p class="hint">Press <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>E</kbd> any time to come back here, or click Ember's handle in the bottom-right corner.</p>
    </section>

    <section aria-labelledby="copilot-h">
      <h2 id="copilot-h">Copilot</h2>
      <div class="copilot">
        <p class="agent-line"><i id="agent-dot" class="dot"></i><span id="agent-text">Checking…</span></p>
        <div class="agent-actions">
          <button type="button" id="sign-in" class="btn" hidden>Sign in with GitHub</button>
          <button type="button" id="sign-out" class="btn quiet" hidden>Sign out</button>
        </div>
        <p id="sign-in-msg" class="sign-in-msg" hidden></p>
        <div class="models" id="models" hidden>
          <label for="m-conductor">Conversation model</label>
          <select id="m-conductor"></select>
          <label for="m-worker">Model for tasks (needs vision)</label>
          <select id="m-worker"></select>
        </div>
        <p class="usage" id="usage"></p>
        <p class="hint">Ask Ember anything with <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>Space</kbd>.</p>
      </div>
    </section>

    <section aria-labelledby="checks-h">
      <h2 id="checks-h">Setup check</h2>
      <ul class="checks" id="checks"></ul>
    </section>

    <section aria-labelledby="about-h">
      <h2 id="about-h">About this build</h2>
      <dl class="facts" id="facts"></dl>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
