<!doctype html>
<html lang="en" class="content">
<head>
  <meta charset="utf-8">
  <!-- style-src allows inline style elements: xterm's DOM renderer writes each terminal's colours and cell metrics into
       <style> elements it makes itself. Nothing on this page is ever built from HTML: commands, card lines and output
       are text nodes or xterm cells, so no command or output text can reach a style. Scripts stay 'self' only. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Ember commands</title>
  <link rel="stylesheet" href="../shared/ember.css">
  <link rel="stylesheet" href="xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="window">
    <div id="cards" class="cards" hidden></div>
    <div id="pending" class="pending" role="status" aria-live="polite"></div>
    <p id="empty" class="empty">Commands Ember runs show here. You can watch them, type into them and stop them.</p>
    <div id="tabs" class="tabs" role="tablist" aria-label="Commands" hidden></div>
    <div id="panels" class="panels"><div id="measure" class="term measure" aria-hidden="true"></div></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
