<!doctype html>
<html lang="en" class="content">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Ember</title>
  <link rel="stylesheet" href="../shared/ember.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <form id="card" class="card" role="dialog" aria-labelledby="title" aria-describedby="where lead" autocomplete="off" novalidate hidden>
      <div id="words" class="words">
        <h1 id="title" class="title" tabindex="-1"></h1>
        <p id="where" class="where"></p>
        <p id="lead" class="lead"></p>
        <div id="fields" class="fields"></div>
      </div>
      <!-- Never hidden, only emptied: a screen reader hears what fills them. -->
      <div class="notes">
        <p id="problem" class="problem" role="alert"></p>
        <p id="hint" class="hint" aria-live="polite"></p>
      </div>
      <div class="buttons">
        <button type="button" id="cancel" class="btn quiet"></button>
        <button type="submit" id="save" class="btn"></button>
      </div>
    </form>
  </main>
  <script src="main.js"></script>
</body>
</html>
