<!doctype html>
<html lang="en" class="content">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Ember</title>
  <link rel="stylesheet" href="../shared/ember.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div id="card" class="card" role="dialog" aria-labelledby="risk title" aria-describedby="body" hidden>
      <p id="risk" class="risk" hidden></p>
      <h1 id="title" class="title" tabindex="-1"></h1>
      <div id="body" class="body"></div>
      <div id="legend" class="legend" hidden></div>
      <form id="form" class="form" autocomplete="off" hidden>
        <label id="field-label" for="field"></label>
        <input id="field" type="password" autocomplete="off" spellcheck="false" maxlength="1024">
      </form>
      <p id="hint" class="hint" aria-live="polite" hidden></p>
      <div id="buttons" class="buttons"></div>
    </div>
    <!-- Outside the card: a press's refusal stays readable when its card is pulled before the reply comes back. -->
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
  </main>
  <script src="main.js"></script>
</body>
</html>
