<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Ember</title>
  <link rel="stylesheet" href="../shared/ember.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div id="card" class="card" role="dialog" aria-labelledby="title" aria-describedby="body" hidden>
      <h1 id="title" class="title" tabindex="-1"></h1>
      <div id="body" class="body"></div>
      <div id="legend" class="legend" hidden></div>
      <form id="form" class="form" autocomplete="off" hidden>
        <label id="field-label" for="field"></label>
        <input id="field" type="password" autocomplete="off" spellcheck="false" maxlength="1024">
      </form>
      <div id="buttons" class="buttons"></div>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
