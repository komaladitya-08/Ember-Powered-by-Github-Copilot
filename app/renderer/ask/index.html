<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Ask Ember</title>
  <link rel="stylesheet" href="../shared/ember.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <form id="form" class="ask" autocomplete="off">
    <label for="q" class="sr">Ask or tell Ember</label>
    <div class="field">
      <!-- Ember's spark, as Spotlight's magnifier: the box is where you ask. -->
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.5 4.6 2.4 6.9 7 7.5-4.6.6-6.5 2.9-7 7.5-.5-4.6-2.4-6.9-7-7.5 4.6-.6 6.5-2.9 7-7.5zM19 15.5c.2 1.9 1 2.8 2.9 3-1.9.2-2.7 1.1-2.9 3-.2-1.9-1-2.8-2.9-3 1.9-.2 2.7-1.1 2.9-3z"/></svg>
      <input id="q" type="text" placeholder="Ask or tell Ember… e.g. “turn on Night Light”" maxlength="2000" autofocus aria-describedby="hint sees">
    </div>
    <p class="meta"><span id="sees" class="sees" hidden></span><span id="hint" class="hint">Enter to send<span id="hint-history" hidden> · ↑ earlier questions</span> · Esc to close</span></p>
  </form>
  <script src="main.js"></script>
</body>
</html>
