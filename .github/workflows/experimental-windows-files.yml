name: experimental-windows-files

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/experimental-windows-files.yml"
      - "app/main/agent/windows-coding-*.ts"
      - "app/main/agent/windows-scoped-coding-files.ts"
      - "app/main/agent/coding-privacy*.ts"
      - "app/main/agent/scoped-coding-files.ts"
      - "test/integration/windows-coding-files-native.test.ts"
      - "test/unit/windows-coding-native.test.ts"

permissions:
  contents: read

concurrency:
  group: experimental-windows-files-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-files:
    name: Native Windows file foundation (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Native directory ABI and failure ownership
        run: npm test -- test/unit/windows-coding-native.test.ts --maxWorkers=1
      # This is a real NTFS test independent of the blocked LPAC child / PowerShell runtime experiments.
      - name: Exact native file identities, source isolation, atomic edits and Stop
        timeout-minutes: 8
        run: node scripts/run-integration.mjs test/integration/windows-coding-files-native.test.ts
