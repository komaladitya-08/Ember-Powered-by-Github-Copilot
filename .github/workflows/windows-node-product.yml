name: Windows Node product

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product:
    name: Node product ${{ matrix.journey }} (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
        journey: [native, source, packaged]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # Only the fixed reviewed producer archive; never a model/runtime credential.
    env:
      EMBER_WINDOWS_NODE_PRODUCT_IMAGE: ${{ matrix.image }}
      EMBER_WINDOWS_NODE_PRODUCT_JOURNEY: ${{ matrix.journey }}
      EMBER_WINDOWS_NODE_PRODUCT_TEST: "1"
      EMBER_ELECTRON_WINDOWS_NODE_TEST: "1"
      EMBER_PACKAGED_WINDOWS_NODE_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
      - name: Require the reviewed POSIX producer and authenticate its exact archive
        id: reviewed_input
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          const fs = require("node:fs");
          const path = require("node:path");
          const { createHash } = require("node:crypto");
          const { spawnSync, execFileSync } = require("node:child_process");
          // The fixed POSIX producer is authenticated; the expanded current-source graph awaits fresh qualification.
          // Product admission stays closed until seven-case evidence on both images is reviewed.
          // Workflow inputs or caller environment cannot select another producer or proof.
          const reviewed = Object.freeze({
            ready: false,
            run: 43991252195,
            commit: "b75c944dec58973d157542e2d4d2db3720667982",
            artifact: 14289217635,
            archiveBytes: 38425334,
            archiveSha256: "cbbbf6c641c41bda8ece457c28a54b9bc4121a068dc376725bcf0e3ac24a2f62",
            manifestSha256: "d6137e7afb434adfe04ce9454aa65e1891e6e4fdaffb248e6303a2fe14cfe89f",
            assetProofCommit: null,
            assetProofManifestSha256: null,
            verifierFileSha256: null,
          });
          if (reviewed.ready !== true || !/^[0-9a-f]{40}$/.test(reviewed.commit ?? "") ||
              !Number.isSafeInteger(reviewed.artifact) || reviewed.artifact < 1 ||
              !Number.isSafeInteger(reviewed.archiveBytes) || reviewed.archiveBytes < 1 || reviewed.archiveBytes > 256 * 1024 * 1024 ||
              !/^[0-9a-f]{64}$/.test(reviewed.archiveSha256 ?? "") || !/^[0-9a-f]{64}$/.test(reviewed.manifestSha256 ?? "") ||
              !/^[0-9a-f]{40}$/.test(reviewed.assetProofCommit ?? "") || !/^[0-9a-f]{64}$/.test(reviewed.assetProofManifestSha256 ?? "") ||
              !/^[0-9a-f]{64}$/.test(reviewed.verifierFileSha256 ?? "")) {
            throw new Error("Windows Node product CI is blocked pending literal reviewed POSIX producer metadata.");
          }
          try {
            const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8", timeout: 10_000, maxBuffer: 128 }).trim();
            if (head !== process.env.GITHUB_SHA) throw new Error("The product checkout is not the required workflow commit.");
            const manifestBytes = fs.readFileSync("app/shared/windows-node-toolchain.json");
            const digest = bytes => createHash("sha256").update(bytes).digest("hex");
            const manifest = JSON.parse(manifestBytes);
            if (digest(manifestBytes) !== reviewed.manifestSha256 || manifest.producerRun !== reviewed.run ||
                manifest.producerCommit !== reviewed.commit || manifest.producerArtifact !== reviewed.artifact ||
                manifest.platform !== "win32" || manifest.arch !== "x64" || manifest.scope !== "offline-root-only-node") {
              throw new Error("The product toolchain manifest is not the reviewed POSIX producer.");
            }
            const download = spawnSync("gh", ["api", "repos/komaladitya-08/Ember-Powered-by-Github-Copilot/actions/artifacts/" + reviewed.artifact + "/zip"],
              { encoding: "buffer", timeout: 120_000, maxBuffer: reviewed.archiveBytes + 1, windowsHide: true });
            if (download.error || download.status !== 0 || download.signal || !Buffer.isBuffer(download.stdout) ||
                download.stdout.length !== reviewed.archiveBytes || digest(download.stdout) !== reviewed.archiveSha256) {
              throw new Error("The reviewed Windows Node producer archive is unavailable or changed.");
            }
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "windows-node-product-producer.zip"), download.stdout, { flag: "wx" });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "proofCommit=" + reviewed.assetProofCommit + "\nproofManifest=" +
              reviewed.assetProofManifestSha256 + "\nproofVerifier=" + reviewed.verifierFileSha256 + "\n");
            console.info("Authenticated Windows Node product input", JSON.stringify({ head, producerRun: reviewed.run,
              producerCommit: reviewed.commit, producerArtifact: reviewed.artifact, manifestSha256: reviewed.manifestSha256 }));
          } catch { throw new Error("Windows Node product input could not be verified."); }
      - name: Extract only the authenticated producer members
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $manifest = Get-Content -LiteralPath app/shared/windows-node-toolchain.json -Raw | ConvertFrom-Json
            $expected = @{}
            foreach ($file in $manifest.files) {
              if ($file.source -notmatch '^[A-Za-z0-9.-]+$' -or $expected.ContainsKey($file.source)) { throw "Invalid fixed producer members." }
              $expected[$file.source] = $file
            }
            if ($expected.Count -ne 4) { throw "The fixed producer member set changed." }
            $destination = Join-Path $PWD ".cache/windows-node-toolchain"
            if (Test-Path -LiteralPath $destination) { throw "The producer cache must be fresh." }
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $env:RUNNER_TEMP "windows-node-product-producer.zip"))
            try {
              if ($archive.Entries.Count -ne 4) { throw "The producer archive member count changed." }
              $seen = @{}
              foreach ($entry in $archive.Entries) {
                $pin = $expected[$entry.FullName]
                if ($null -eq $pin -or $seen.ContainsKey($entry.FullName) -or $entry.Length -ne $pin.bytes -or
                    (($entry.ExternalAttributes -shr 16) -band 0xf000) -eq 0xa000) { throw "An archived producer member is unsupported." }
                $seen[$entry.FullName] = $true
              }
              [System.IO.Directory]::CreateDirectory($destination) | Out-Null
              foreach ($entry in $archive.Entries) {
                $outputPath = Join-Path $destination $entry.FullName
                $inputFile = $entry.Open()
                try {
                  $outputFile = [System.IO.File]::Open($outputPath, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
                  try { $inputFile.CopyTo($outputFile) } finally { $outputFile.Dispose() }
                } finally { $inputFile.Dispose() }
                if ((Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[$entry.FullName].sha256) {
                  throw "An extracted producer member changed."
                }
              }
            } finally { $archive.Dispose() }
            $verification = & node --input-type=module -e 'import path from "node:path"; import { verifyWindowsNodeToolchain } from "./scripts/package/windows-node-toolchain.mjs"; verifyWindowsNodeToolchain(path.resolve(".cache/windows-node-toolchain"), "producer");' 2>&1
            if ($LASTEXITCODE -ne 0) { throw "The exact producer package verification failed." }
          } catch { throw "The authenticated Windows Node producer members could not be verified." }
      - run: npm install -g npm@11.6.2
      # The actual Electron executable and its normal sandbox are required for the source and ZIP journeys.
      - run: npm ci
      - name: Bind all product journeys to the reviewed native source catalog
        shell: node {0}
        env:
          REVIEWED_ASSET_PROOF_COMMIT: ${{ steps.reviewed_input.outputs.proofCommit }}
          REVIEWED_ASSET_PROOF_MANIFEST: ${{ steps.reviewed_input.outputs.proofManifest }}
          REVIEWED_ASSET_PROOF_VERIFIER: ${{ steps.reviewed_input.outputs.proofVerifier }}
        run: |
          try {
            const fs = require("node:fs"), path = require("node:path"), crypto = require("node:crypto");
            const { createRequire } = require("node:module"), { Script } = require("node:vm");
            const proofCommit = process.env.REVIEWED_ASSET_PROOF_COMMIT, catalog = process.env.REVIEWED_ASSET_PROOF_MANIFEST;
            const verifierSha256 = process.env.REVIEWED_ASSET_PROOF_VERIFIER, image = process.env.EMBER_WINDOWS_NODE_PRODUCT_IMAGE;
            if (!/^[0-9a-f]{40}$/.test(proofCommit ?? "") || !/^[0-9a-f]{64}$/.test(catalog ?? "") ||
                !/^[0-9a-f]{64}$/.test(verifierSha256 ?? "") || !["windows-2022", "windows-2025"].includes(image)) throw new Error();
            const repository = fs.realpathSync.native(process.cwd());
            const file = path.join(repository, "test/fixtures/windows-node-asset-enforcement-run.ts");
            const same = (a, b) => a.isFile() && b.isFile() && !a.isSymbolicLink() && !b.isSymbolicLink() &&
              a.nlink === 1n && b.nlink === 1n && a.dev === b.dev && a.ino === b.ino && a.size === b.size;
            const clock = (a, b) => same(a, b) && a.mtimeNs === b.mtimeNs && a.ctimeNs === b.ctimeNs;
            const before = fs.lstatSync(file, { bigint: true });
            if (!before.isFile() || before.isSymbolicLink() || before.nlink !== 1n || before.size < 1n || before.size > 1024n * 1024n ||
                fs.realpathSync.native(file).toLowerCase() !== file.toLowerCase()) throw new Error();
            let bytes, fd;
            try {
              fd = fs.openSync(file, fs.constants.O_RDONLY | (fs.constants.O_NOFOLLOW ?? 0) | (fs.constants.O_NONBLOCK ?? 0));
              const opened = fs.fstatSync(fd, { bigint: true }); if (!same(before, opened)) throw new Error();
              bytes = Buffer.alloc(Number(before.size) + 1); let count = 0;
              while (count < bytes.length) {
                const read = fs.readSync(fd, bytes, count, bytes.length - count, count);
                if (!Number.isInteger(read) || read < 0 || read > bytes.length - count) throw new Error();
                if (!read) break; count += read;
              }
              const after = fs.fstatSync(fd, { bigint: true }), named = fs.lstatSync(file, { bigint: true });
              if (count !== Number(before.size) || !clock(opened, after) || !clock(before, named) || !same(after, named)) throw new Error();
              bytes = bytes.subarray(0, count);
            } finally { if (fd !== undefined) fs.closeSync(fd); }
            if (crypto.createHash("sha256").update(bytes).digest("hex") !== verifierSha256) throw new Error();
            const source = bytes.toString("utf8"); if (!Buffer.from(source, "utf8").equals(bytes)) throw new Error();
            // The node shell script is temporary; resolve dependencies from the canonical checkout.
            const { transformSync } = createRequire(path.join(repository, "package.json"))("esbuild");
            const compiled = transformSync(source, { loader: "ts", format: "cjs", target: "node22", sourcemap: false, logLevel: "silent" }).code;
            const module = { exports: {} }, allowed = { "node:fs": fs, "node:path": path, "node:crypto": crypto };
            const facts = new Script(compiled + "\nmodule.exports.verifyWindowsNodeAssetEnforcementRun(repository, input);",
              { filename: "reviewed-native-source-catalog.cjs" }).runInNewContext({ module, exports: module.exports, Buffer, repository, input: { commit: proofCommit, image },
              require: name => { if (!Object.hasOwn(allowed, name)) throw new Error(); return allowed[name]; } },
              { timeout: 10_000, contextCodeGeneration: { strings: false, wasm: false } });
            if (facts.compileCommit !== proofCommit || facts.sourceManifestSha256 !== catalog) throw new Error();
          } catch { throw new Error("The Windows Node product checkout does not match the reviewed native source catalog."); }
      - name: Stage the exact development Electron resources and build the actual app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw "The pinned development Electron installation failed." }
          node scripts/package/windows-node-toolchain-dev.mjs
          if ($LASTEXITCODE -ne 0) { throw "The development Electron toolchain could not be verified." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "The product build failed." }
      - name: Build the complete release ZIP from the same reviewed inputs
        if: matrix.journey == 'packaged'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/voice/prepare.mjs --voice ryan
          node scripts/package/runtimes.mjs
          node scripts/package/remote-parts.mjs
          node scripts/package/wsl-coding-tools.mjs
          node scripts/package/stage.mjs --with-models --with-runtimes --with-windows-node-toolchain --with-wsl-coding-tools
          node scripts/package/archive.mjs
      - name: Require the actual native, source Home or packaged Home proof without skipped cases
        id: proof
        shell: node {0}
        run: |
          let failureJourney = 0, failureAttempt;
          const failureFacts = (attempt, packaged = false) => {
            const limits = { operation: 18, iteration: 12, welcomeStep: 6, nextLabel: 7, target: 7, bridgeError: 5, snapshotFlags: 15, focusFlags: 31, inputResult: 2, bridgeStage: 30, projectStage: 16, providerStage: 12, commandStage: 14, commandDecision: 8, repairStep: 4, repairResults: 4, focusIdentity: 255, cardFlags: 15 };
            const empty = { operation: 0, iteration: 0, welcomeStep: 0, nextLabel: 0, target: 0, bridgeError: 0, snapshotFlags: 0, focusFlags: 0, inputResult: 0, bridgeStage: 0, projectStage: 0, providerStage: 0, commandStage: 0, commandDecision: 0, repairStep: 0, repairResults: 0, focusIdentity: 0, cardFlags: 0 };
            const facts = packaged ? { child: 0, timeout: 0, phase: 0, observation: empty } : { child: 0, timeout: 0, phases: [0, 0, 0, 0, 0, 0, 0] };
            try {
              const { types } = require("node:util"), missing = Symbol();
              const own = (object, key) => {
                if (!object || typeof object !== "object" || types.isProxy(object)) return missing;
                const descriptor = Object.getOwnPropertyDescriptor(object, key);
                return descriptor && Object.hasOwn(descriptor, "value") ? descriptor.value : missing;
              };
              const status = own(attempt, "status"), error = own(attempt, "error");
              facts.child = status === null ? 3 : Number.isSafeInteger(status) ? status === 0 ? 1 : 2 : 0;
              if (error && typeof error === "object" && !types.isProxy(error) && types.isNativeError(error) && own(error, "code") === "ETIMEDOUT") facts.timeout = 1;
              const texts = [];
              for (const key of ["stdout", "stderr"]) {
                const bytes = own(attempt, key);
                if (!bytes || types.isProxy(bytes) || !Buffer.isBuffer(bytes) || Object.getPrototypeOf(bytes) !== Buffer.prototype ||
                    ["length", "byteLength", "byteOffset", "buffer", "toString", "utf8Slice"].some(name => Object.getOwnPropertyDescriptor(bytes, name)) || bytes.length > 2 * 1024 * 1024) return facts;
                const decoded = Buffer.prototype.toString.call(bytes, "utf8");
                if (!Buffer.prototype.equals.call(Buffer.from(decoded, "utf8"), bytes)) return facts;
                texts.push(decoded.replace(/\x1b\[[0-9;]*m/g, "").replace(/\r\n/g, "\n"));
              }
              if (packaged) {
                const phases = new Set();
                for (const text of texts) for (const match of text.matchAll(/^[ \t]*Error: Windows Node packaged journey refused \(phase ([1-9]|1[0-2])\)\.$/gm)) phases.add(Number(match[1]));
                facts.phase = phases.size === 1 ? [...phases][0] : 0;
                let observation, bad = false;
                for (const text of texts) for (const line of text.split("\n")) {
                  if (!/^[ \t]*Windows Node packaged cached observation /.test(line)) continue;
                  try {
                    const match = /^[ \t]*Windows Node packaged cached observation (\{[^\r\n]{1,512}\})$/.exec(line);
                    if (!match) { bad = true; continue; }
                    const candidate = JSON.parse(match[1]);
                    if (!candidate || typeof candidate !== "object" || types.isProxy(candidate) || Array.isArray(candidate) || Object.keys(candidate).length !== Object.keys(limits).length) { bad = true; continue; }
                    const next = { ...empty };
                    if (Object.keys(limits).some(key => { const value = own(candidate, key); if (!Number.isInteger(value) || value < 0 || value > limits[key]) return true; next[key] = value; return false; })) { bad = true; continue; }
                    if (observation && Object.keys(limits).some(key => observation[key] !== next[key])) bad = true;
                    else observation = next;
                  } catch { bad = true; }
                }
                if (!bad && observation) facts.observation = observation;
                return facts;
              }
              const conflicts = new Set();
              for (const text of texts) for (const match of text.matchAll(/^[ \t]*Error: Windows Node source journey refused \(case ([1-7]), phase ([1-9]|1[0-7])\)\.$/gm)) {
                const index = Number(match[1]) - 1, phase = Number(match[2]);
                if (conflicts.has(index)) continue;
                if (facts.phases[index] && facts.phases[index] !== phase) { facts.phases[index] = 0; conflicts.add(index); }
                else facts.phases[index] = phase;
              }
            } catch { /* Observation cannot replace the original failure or change its authority. */ }
            return facts;
          };
          try {
            const fs = require("node:fs");
            const path = require("node:path");
            const { spawnSync } = require("node:child_process");
            const suites = {
              native: ["test/integration/windows-node-product-native.test.ts"],
              source: ["test/integration/project-coding-windows-node-electron.test.ts"],
              packaged: ["test/integration/windows-node-packaged-product.test.ts"],
            };
            const expectedCases = { native: 2, source: 7, packaged: 1 };
            const journey = process.env.EMBER_WINDOWS_NODE_PRODUCT_JOURNEY, image = process.env.EMBER_WINDOWS_NODE_PRODUCT_IMAGE;
            failureJourney = journey === "source" ? 1 : journey === "packaged" ? 2 : 0;
            const files = suites[journey];
            if (!files || !["windows-2022", "windows-2025"].includes(image) || files.some(file => !fs.existsSync(file))) {
              throw new Error("A required Windows Node product proof is unavailable.");
            }
            const env = { ...process.env };
            if (journey === "packaged") {
              const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
              if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) throw new Error("Invalid product package version.");
              const zip = path.resolve("dist/package/Ember-" + version + "-win-x64.zip");
              const info = fs.lstatSync(zip);
              if (!info.isFile() || info.isSymbolicLink() || info.nlink !== 1) throw new Error("The required product ZIP is unavailable.");
              env.EMBER_WINDOWS_NODE_PACKAGE = zip;
            }
            const reportPath = path.join(process.env.RUNNER_TEMP, "windows-node-product-" + journey + ".json");
            if (fs.existsSync(reportPath)) throw new Error("The required product report must be fresh.");
            const executed = spawnSync(process.execPath, ["scripts/run-integration.mjs", ...files, "--maxWorkers=1",
              "--reporter=default", "--reporter=json", "--outputFile=" + reportPath],
              { env, stdio: ["ignore", "pipe", "pipe"], encoding: "buffer", maxBuffer: 2 * 1024 * 1024, windowsHide: true, timeout: 20 * 60_000 });
            failureAttempt = executed;
            if (executed.error || executed.status !== 0 || executed.signal) throw new Error("The required Windows Node product proof failed.");
            const reportInfo = fs.lstatSync(reportPath);
            if (!reportInfo.isFile() || reportInfo.isSymbolicLink() || reportInfo.nlink !== 1 || reportInfo.size > 16 * 1024 * 1024) {
              throw new Error("The required product report is unavailable or unsupported.");
            }
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            if (report.success !== true || report.numTotalTests !== expectedCases[journey] ||
                report.numPassedTests !== report.numTotalTests || report.numFailedTests !== 0 ||
                report.numPendingTests !== 0 || report.numTodoTests !== 0 || report.numFailedTestSuites !== 0 || report.numPendingTestSuites !== 0 ||
                !Array.isArray(report.testResults) || report.testResults.length !== files.length ||
                report.testResults.some((result, index) => result.status !== "passed" ||
                  path.resolve(result.name) !== path.resolve(files[index]) || !Array.isArray(result.assertionResults) ||
                  result.assertionResults.length !== expectedCases[journey] || result.assertionResults.some(assertion => assertion.status !== "passed")) ||
                report.testResults.reduce((count, result) => count + result.assertionResults.length, 0) !== report.numTotalTests) {
              throw new Error("Every required Windows Node product case must pass; skipped or empty proofs do not count.");
            }
            console.info("Required Windows Node product proof passed", JSON.stringify({ commit: process.env.GITHUB_SHA, image, journey,
              files, passed: report.numPassedTests, skipped: 0 }));
            if (journey === "packaged") fs.appendFileSync(process.env.GITHUB_OUTPUT, "zip=" + env.EMBER_WINDOWS_NODE_PACKAGE + "\n");
          } catch {
            try { if (failureJourney) console.info(failureJourney === 1 ? "Windows Node source proof failure facts" : "Windows Node packaged proof failure facts",
              JSON.stringify(failureFacts(failureAttempt, failureJourney === 2))); }
            catch { /* Diagnostic storage or projection faults do not replace the original refusal. */ }
            throw new Error("The required Windows Node product proof could not be verified.");
          }
      - name: Retain only the exact ZIP which passed the packaged product journey
        if: matrix.journey == 'packaged'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ember-windows-node-product-${{ matrix.image }}
          path: ${{ steps.proof.outputs.zip }}
          if-no-files-found: error
          retention-days: 3

  required:
    name: Required Windows Node product proofs
    if: always()
    needs: [product]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all configured Windows product matrix leaves
        shell: node {0}
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          const results = JSON.parse(process.env.REQUIRED_RESULTS ?? "{}");
          if (Object.keys(results).length !== 1 || results.product?.result !== "success") {
            throw new Error("Windows Node product proofs are required; failure, cancellation or skipped work blocks the gate.");
          }
