name: coding-boundary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/coding-boundary.yml"
      - "app/main/agent/experimental-windows-lpac*.ts"
      - "app/main/agent/isolated-windows-command*.ts"
      - "app/main/platform/os.ts"
      - "test/fixtures/experimental-windows-lpac.c"
      - "test/fixtures/isolated-windows-command-startup-hook.cs"
      - "test/integration/experimental-windows-lpac-native.test.ts"
      - "test/integration/isolated-windows-command-powershell-native.test.ts"
      - "test/unit/experimental-windows-lpac*.test.ts"
      - "test/unit/isolated-windows-command*.test.ts"
      - "test/unit/experimental-compatibility-workflows.test.ts"
      - "docs/DEVELOPING.md"

permissions:
  contents: read

concurrency:
  group: coding-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable Windows compatibility contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Portable lifecycle, bindings, assets and workflow contracts
        run: npm test -- test/unit/experimental-windows-lpac.test.ts test/unit/experimental-windows-lpac-api.test.ts test/unit/isolated-windows-command-assets.test.ts test/unit/experimental-compatibility-workflows.test.ts --maxWorkers=1

  windows-boundary:
    name: Windows coding boundary experiments (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Keep native experiment diagnostics independent of the full app's speech and packaging checks.
      # Manual compatibility evidence only; the supported bundled-Node product has its own required gate.
      - name: Native LPAC token, ACL, job and descendant shutdown
        timeout-minutes: 2
        run: node scripts/run-integration.mjs test/integration/experimental-windows-lpac-native.test.ts
      - name: PowerShell compatibility with fresh package-specific assets
        if: ${{ !cancelled() && hashFiles('test/integration/isolated-windows-command-powershell-native.test.ts') != '' }}
        timeout-minutes: 5
        run: node scripts/run-integration.mjs test/integration/isolated-windows-command-powershell-native.test.ts
