name: experimental-windows-node-lpac

on:
  pull_request:
    paths:
      - ".github/workflows/experimental-windows-node-lpac.yml"
      - "scripts/experimental/windows-node-lpac-pin.json"
      - "scripts/experimental/windows-node-lpac-sources.json"
      - "test/fixtures/windows-node-lpac-*"
      - "test/fixtures/experimental-windows-lpac.c"
      - "test/integration/isolated-windows-command-node-native.test.ts"
      - "test/unit/windows-node-lpac-startup.test.ts"
      - "test/unit/windows-node-lpac-events.test.ts"
      - "test/unit/windows-node-lpac-io.test.ts"
      - "test/unit/windows-node-lpac-fatal.test.ts"
      - "app/main/agent/experimental-windows-lpac*.ts"
      - "app/main/agent/isolated-windows-command-assets.ts"
      - "app/main/platform/os.ts"
      - "test/unit/experimental-compatibility-workflows.test.ts"
      - "docs/DEVELOPING.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-windows-node-lpac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable stock Node LPAC diagnostic contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Startup, event, stdio lifecycle, fatal privacy and workflow contracts
        run: npm test -- test/unit/windows-node-lpac-startup.test.ts test/unit/windows-node-lpac-events.test.ts test/unit/windows-node-lpac-io.test.ts test/unit/windows-node-lpac-fatal.test.ts test/unit/experimental-compatibility-workflows.test.ts --maxWorkers=1

  node-lpac:
    name: Direct Node ${{ matrix.node }} LPAC (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        node: ["22.23.5", "24.21.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Fetch the independently pinned official Windows archive and extract only node.exe
        timeout-minutes: 2
        shell: pwsh
        env:
          NODE_PROOF_VERSION: ${{ matrix.node }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Get-Content -LiteralPath scripts/experimental/windows-node-lpac-pin.json -Raw | ConvertFrom-Json
          $pin = $pins.versions.PSObject.Properties[$env:NODE_PROOF_VERSION].Value
          if (!$pin -or $pin.version -ne $env:NODE_PROOF_VERSION) { throw 'No exact Windows Node pin.' }
          $proofRoot = Join-Path $env:RUNNER_TEMP ('ember-node-proof-' + [Guid]::NewGuid().ToString())
          [IO.Directory]::CreateDirectory($proofRoot) | Out-Null
          $proofArchive = Join-Path $proofRoot $pin.archive
          Invoke-WebRequest -Uri ($pin.baseUrl + $pin.archive) -OutFile $proofArchive -TimeoutSec 90
          if ((Get-Item -LiteralPath $proofArchive).Length -ne $pin.archiveBytes -or (Get-FileHash -LiteralPath $proofArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.archiveSha256) { throw 'The Windows archive does not match its own pin.' }
          $zip = [IO.Compression.ZipFile]::OpenRead($proofArchive)
          try {
            $members = @($zip.Entries | Where-Object { $_.FullName -ceq $pin.member })
            if ($members.Count -ne 1 -or $members[0].Length -ne $pin.executableBytes -or $members[0].CompressedLength -gt $pin.archiveBytes) { throw 'No unique bounded official node.exe member.' }
            $node = Join-Path $proofRoot 'node.exe'
            $proofInput = $members[0].Open()
            $proofOutput = [IO.File]::Open($node, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
            try { $proofInput.CopyTo($proofOutput) } finally { $proofOutput.Dispose(); $proofInput.Dispose() }
          } finally { $zip.Dispose() }
          if ((Get-Item -LiteralPath $node).Length -ne $pin.executableBytes -or (Get-FileHash -LiteralPath $node -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.executableSha256) { throw 'The Windows executable does not match its own pin.' }
          "EMBER_LPAC_NODE_VERSION=$($pin.version)" >> $env:GITHUB_ENV
          "EMBER_LPAC_NODE_ASSET_ROOT=$proofRoot" >> $env:GITHUB_ENV
      - name: Direct Node, in-process Node test, and separate unsupported-child diagnostic
        timeout-minutes: 5
        run: node scripts/run-integration.mjs test/integration/isolated-windows-command-node-native.test.ts
        env:
          EMBER_LPAC_NODE_PROOF: "1"
      # Only bounded synthetic facts are printed. No raw trace, environment, canary, full profile or dump is uploaded.
      # Server-runner success does not enable native Windows coding or establish Windows 10/11 client compatibility.
