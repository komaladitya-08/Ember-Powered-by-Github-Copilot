name: experimental-powershell-etw

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/experimental-powershell-etw.yml"
      - "scripts/experimental/build-powershell-lpac-etw.ps1"
      - "scripts/experimental/powershell-lpac-etw.*"
      - "test/integration/experimental-powershell-etw-native.test.ts"
      - "test/fixtures/isolated-windows-command-startup-hook.cs"

permissions:
  contents: read

concurrency:
  group: experimental-powershell-etw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-compatibility:
    name: Pinned PowerShell restricted ETW source experiment
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build pinned Eventing source into an explicitly experimental portable runtime
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/experimental/build-powershell-lpac-etw.ps1 -Scratch (Join-Path $env:RUNNER_TEMP 'ember-powershell-etw-source')
      - name: Real host and capability-free LPAC compatibility observations
        timeout-minutes: 5
        env:
          EMBER_EXPERIMENTAL_PS7_REQUIRED: "1"
        run: node scripts/run-integration.mjs test/integration/experimental-powershell-etw-native.test.ts
      # Publish provenance and test output only; this experiment never installs or distributes a product runtime.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: experimental-powershell-etw-provenance
          path: ${{ runner.temp }}/ember-powershell-etw-source/build-provenance.json
          if-no-files-found: warn
          retention-days: 7
