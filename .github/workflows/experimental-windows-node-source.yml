name: experimental-windows-node-source

on:
  pull_request:
    paths:
      - ".github/workflows/experimental-windows-node-source.yml"
      - "scripts/experimental/*windows-node-source*"
      - "scripts/experimental/extract-node-source.py"
      - "test/fixtures/windows-node-source-*"
      - "test/integration/windows-node-source-native.test.ts"
      - "test/unit/windows-node-source*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-windows-node-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-node:
    # Native-only follow-ups reuse the separately attested artifact; a skip is not a new build proof.
    if: github.event_name == 'workflow_dispatch' || github.head_ref != 'ember-improve/20261116-source-node-native-reuse'
    name: Source Node feasibility (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Select the pinned trusted host Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -LiteralPath scripts/experimental/windows-node-source-build-pin.json -Raw | ConvertFrom-Json
          $python = $pin.pythonExecutable
          if (!(Test-Path -LiteralPath $python -PathType Leaf)) { throw 'The fixed hosted-toolcache Python is unavailable.' }
          $version = (& $python -I -B -c "import sys; print('.'.join(map(str,sys.version_info[:3])))").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne $pin.pythonVersion) { throw 'The selected Python differs from the fixed host build recipe.' }
          "EMBER_NODE_SOURCE_PYTHON=$python" >> $env:GITHUB_ENV
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Source preparation, compile recipe and bounded receipt contracts
        run: npm test -- test/unit/windows-node-source.test.ts test/unit/windows-node-source-build.test.ts test/unit/windows-node-source-program.test.ts test/unit/windows-node-source-report.test.ts test/unit/windows-node-source-ownership.test.ts test/unit/windows-node-source-fatal.test.ts test/unit/windows-node-source-child-program.test.ts test/unit/windows-node-source-child-host.test.ts test/unit/windows-node-source-child-io.test.ts test/unit/windows-node-source-child-observer.test.ts --maxWorkers=1
      - name: Prepare the unchanged independently pinned official Node control
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Get-Content -LiteralPath scripts/experimental/windows-node-lpac-pin.json -Raw | ConvertFrom-Json
          $pin = $pins.versions.PSObject.Properties['22.23.5'].Value
          if (!$pin -or $pin.version -cne '22.23.5') { throw 'No exact official Windows control pin.' }
          $control = Join-Path $env:RUNNER_TEMP ('ember-node-official-control-' + [Guid]::NewGuid().ToString())
          [IO.Directory]::CreateDirectory($control) | Out-Null
          $archive = Join-Path $control $pin.archive
          Invoke-WebRequest -Uri ($pin.baseUrl + $pin.archive) -OutFile $archive -TimeoutSec 90
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.archiveBytes -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pin.archiveSha256) { throw 'The official control archive differs from its independent pin.' }
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $members = @($zip.Entries | Where-Object { $_.FullName -ceq $pin.member })
            if ($members.Count -ne 1 -or $members[0].Length -ne $pin.executableBytes -or $members[0].CompressedLength -gt $pin.archiveBytes) { throw 'No unique bounded official node.exe member.' }
            $node = Join-Path $control 'node.exe'
            $controlInput = $members[0].Open()
            $controlOutput = [IO.File]::Open($node, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
            try { $controlInput.CopyTo($controlOutput) } finally { $controlOutput.Dispose(); $controlInput.Dispose() }
          } finally { $zip.Dispose() }
          if ((Get-Item -LiteralPath $node).Length -ne $pin.executableBytes -or (Get-FileHash -LiteralPath $node -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pin.executableSha256) { throw 'The official control executable differs from its independent pin.' }
          "EMBER_LPAC_NODE_VERSION=22.23.5" >> $env:GITHUB_ENV
          "EMBER_LPAC_NODE_ASSET_ROOT=$control" >> $env:GITHUB_ENV
      - name: Fetch only the fixed signed Node source and separately pinned NASM archive
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -LiteralPath scripts/experimental/windows-node-source-pin.json -Raw | ConvertFrom-Json
          $parent = Join-Path $env:RUNNER_TEMP ('ember-source-node-' + [Guid]::NewGuid().ToString())
          [IO.Directory]::CreateDirectory($parent) | Out-Null
          $source = Join-Path $parent 'node-v22.23.5.tar.xz'
          $nasm = Join-Path $parent 'nasm-2.16.03-win64.zip'
          Invoke-WebRequest -Uri $pin.sourceArchive.url -OutFile $source -TimeoutSec 120
          if ((Get-Item -LiteralPath $source).Length -ne $pin.sourceArchive.bytes -or (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pin.sourceArchive.sha256) { throw 'The source archive differs from its signed manifest pin.' }
          Invoke-WebRequest -Uri $pin.nasmTool.url -OutFile $nasm -TimeoutSec 90
          if ((Get-Item -LiteralPath $nasm).Length -ne $pin.nasmTool.bytes -or (Get-FileHash -LiteralPath $nasm -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pin.nasmTool.sha256) { throw 'The NASM archive differs from its reviewed independent pin.' }
          "EMBER_NODE_SOURCE_ARCHIVE=$source" >> $env:GITHUB_ENV
          "EMBER_NODE_SOURCE_NASM_ARCHIVE=$nasm" >> $env:GITHUB_ENV
          "EMBER_NODE_SOURCE_BUILD_ROOT=$(Join-Path $parent 'build')" >> $env:GITHUB_ENV
          "EMBER_NODE_SOURCE_BUILD_COMMIT=$env:GITHUB_SHA" >> $env:GITHUB_ENV
      - name: Build the source Node feasibility image and inert bootstrap with the fixed recipe
        id: build
        timeout-minutes: 70
        shell: pwsh
        run: node scripts/experimental/build-windows-node-source.mjs --source-archive "$env:EMBER_NODE_SOURCE_ARCHIVE" --nasm-archive "$env:EMBER_NODE_SOURCE_NASM_ARCHIVE" --destination "$env:EMBER_NODE_SOURCE_BUILD_ROOT" --python "$env:EMBER_NODE_SOURCE_PYTHON"
      - name: Independent official controls and source-built fixed operations after verified job stop
        timeout-minutes: 5
        run: node scripts/run-integration.mjs test/integration/windows-node-source-native.test.ts
        env:
          EMBER_NODE_SOURCE_PROBE: "1"
      - name: Keep only the public-source build assets for subsequent reviewed diagnostics
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-node-22.23.5-windows-2022-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.EMBER_NODE_SOURCE_BUILD_ROOT }}/source-node.exe
            ${{ env.EMBER_NODE_SOURCE_BUILD_ROOT }}/bootstrap.exe
            ${{ env.EMBER_NODE_SOURCE_BUILD_ROOT }}/build-receipt.json
            ${{ env.EMBER_NODE_SOURCE_BUILD_ROOT }}/LICENSE
      # No private runtime scratch, source tree, logs, reports, process output, trace or dump is uploaded.
      # This fixture does not enable product Windows coding or replace the official Node verifier.
