name: experimental-windows-lpac-inherited-child

on:
  pull_request:
    paths:
      - ".github/workflows/experimental-windows-lpac-inherited-child.yml"
      - "test/fixtures/experimental-windows-lpac*.c"
      - "test/fixtures/windows-lpac-inherited-child.ts"
      - "test/unit/windows-lpac-inherited-child.test.ts"
      - "test/integration/windows-lpac-inherited-child-native.test.ts"
      - "app/main/agent/experimental-windows-lpac*.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-windows-lpac-inherited-child-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inherited-child:
    name: Separate inherited LPAC child (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Inherited-child admission and existing native fixture lifecycle contracts
        run: npm test -- test/unit/windows-lpac-inherited-child.test.ts test/unit/experimental-windows-lpac.test.ts test/unit/experimental-windows-lpac-api.test.ts --maxWorkers=1
      - name: Independent original denial control and fully checked inherited-child experiment
        run: node scripts/run-integration.mjs test/integration/windows-lpac-inherited-child-native.test.ts
        env:
          EMBER_LPAC_INHERITED_CHILD_TEST: "1"
          EMBER_LPAC_INHERITED_CHILD_RUNNER: ${{ matrix.os }}
      # Only closed numeric/boolean receipts after root/job stop and verified fixture cleanup are printed.
      # No trace, private scratch, paths, process IDs, descriptors, capabilities or production gate are uploaded/changed.
