name: experimental-windows-uv-observer-abi

on:
  pull_request:
    paths:
      - ".github/workflows/experimental-windows-uv-observer-abi.yml"
      - "scripts/experimental/*uv-observer-abi*"
      - "test/fixtures/windows-uv-observer-abi*"
      - "test/fixtures/windows-uv-observer-abi-build/**"
      - "test/fixtures/windows-uv-observer-abi-shim/**"
      - "test/unit/windows-uv-observer-abi*"
      - "docs/EXPERIMENTAL-WINDOWS-UV-OBSERVER-ABI.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-windows-uv-observer-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Fixed observer ABI portable contracts
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ember-improve/20261116-uv-observer-abi'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Original producer and ordinary-control contracts (Linux C checks are logic only)
        run: npm test -- test/unit/windows-uv-spawn-build-diagnostic.test.ts test/unit/windows-uv-spawn-build.test.ts test/unit/windows-uv-spawn-contract.test.ts test/unit/windows-uv-spawn-emission-extern.test.ts test/unit/windows-uv-spawn-emission-refusal.test.ts test/unit/windows-uv-spawn-emission.test.ts test/unit/windows-uv-spawn-file-version-capture.test.ts test/unit/windows-uv-spawn-file-version.test.ts test/unit/windows-uv-spawn-host.test.ts test/unit/windows-uv-spawn-native.test.ts test/unit/windows-uv-spawn-observe.test.ts test/unit/windows-uv-spawn-ownership.test.ts test/unit/windows-uv-spawn-powershell.test.ts test/unit/windows-uv-spawn-project.test.ts test/unit/windows-uv-spawn-proof.test.ts test/unit/windows-uv-spawn-report.test.ts test/unit/windows-uv-spawn-source.test.ts test/unit/windows-uv-observer-abi-build.test.ts test/unit/windows-uv-observer-abi-control.test.ts test/unit/windows-uv-observer-abi-files.test.ts test/unit/windows-uv-observer-abi-image.test.ts test/unit/windows-uv-observer-abi-report.test.ts test/unit/windows-uv-observer-abi-run.test.ts --maxWorkers=1

  ordinary-control:
    name: Same-object ordinary-host ABI control (windows-2022)
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ember-improve/20261116-uv-observer-abi'
    needs: portable
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Select the exact hosted Python identity before extraction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -LiteralPath scripts/experimental/windows-uv-spawn-build-pin.json -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $pin.pythonExecutable -PathType Leaf)) { throw 'The exact hosted extractor is unavailable.' }
          "EMBER_UV_OBSERVER_ABI_PYTHON=$($pin.pythonExecutable)" >> $env:GITHUB_ENV
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Require original producer and new control contracts before compilation
        run: npm test -- test/unit/windows-uv-spawn-build-diagnostic.test.ts test/unit/windows-uv-spawn-build.test.ts test/unit/windows-uv-spawn-contract.test.ts test/unit/windows-uv-spawn-emission-extern.test.ts test/unit/windows-uv-spawn-emission-refusal.test.ts test/unit/windows-uv-spawn-emission.test.ts test/unit/windows-uv-spawn-file-version-capture.test.ts test/unit/windows-uv-spawn-file-version.test.ts test/unit/windows-uv-spawn-host.test.ts test/unit/windows-uv-spawn-native.test.ts test/unit/windows-uv-spawn-observe.test.ts test/unit/windows-uv-spawn-ownership.test.ts test/unit/windows-uv-spawn-powershell.test.ts test/unit/windows-uv-spawn-project.test.ts test/unit/windows-uv-spawn-proof.test.ts test/unit/windows-uv-spawn-report.test.ts test/unit/windows-uv-spawn-source.test.ts test/unit/windows-uv-observer-abi-build.test.ts test/unit/windows-uv-observer-abi-control.test.ts test/unit/windows-uv-observer-abi-files.test.ts test/unit/windows-uv-observer-abi-image.test.ts test/unit/windows-uv-observer-abi-report.test.ts test/unit/windows-uv-observer-abi-run.test.ts --maxWorkers=1
      - name: Fetch only the signed-manifest-pinned source archive
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -LiteralPath scripts/experimental/windows-uv-spawn-source-pin.json -Raw | ConvertFrom-Json
          $parent = Join-Path $env:RUNNER_TEMP ('ember-uv-observer-abi-' + [Guid]::NewGuid().ToString())
          [IO.Directory]::CreateDirectory($parent) | Out-Null
          $archive = Join-Path $parent 'node-v22.23.5.tar.xz'
          Invoke-WebRequest -Uri $pin.sourceArchive.url -OutFile $archive -TimeoutSec 120
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.sourceArchive.bytes -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sourceArchive.sha256) { throw 'The source archive differs from its fixed signed-manifest pin.' }
          "EMBER_UV_OBSERVER_ABI_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "EMBER_UV_OBSERVER_ABI_ROOT=$(Join-Path $parent 'build')" >> $env:GITHUB_ENV
      - name: Build the unchanged observer once and link that exact object into the control
        timeout-minutes: 12
        shell: pwsh
        run: node scripts/experimental/build-windows-uv-observer-abi.mjs --archive "$env:EMBER_UV_OBSERVER_ABI_ARCHIVE" --destination "$env:EMBER_UV_OBSERVER_ABI_ROOT" --python "$env:EMBER_UV_OBSERVER_ABI_PYTHON"
      - name: Run only the fixed ordinary-host delegates and verify natural completion
        timeout-minutes: 1
        run: node scripts/experimental/run-windows-uv-observer-abi.mjs
        env:
          EMBER_UV_OBSERVER_ABI_CONTROL: "1"
      # This never sets the separate LPAC/native flag. No source, object, assembly or compiler output is uploaded.
      - name: Keep only public control assets and the closed ordinary-host result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uv-observer-abi-ordinary-${{ github.sha }}
          path: |
            ${{ env.EMBER_UV_OBSERVER_ABI_ROOT }}/observer-abi-control.exe
            ${{ env.EMBER_UV_OBSERVER_ABI_ROOT }}/abi-build-receipt.json
            ${{ env.EMBER_UV_OBSERVER_ABI_ROOT }}/source-build-receipt.json
            ${{ env.EMBER_UV_OBSERVER_ABI_ROOT }}/abi-result.json
            ${{ env.EMBER_UV_OBSERVER_ABI_ROOT }}/LICENSE
          if-no-files-found: error
          retention-days: 7
