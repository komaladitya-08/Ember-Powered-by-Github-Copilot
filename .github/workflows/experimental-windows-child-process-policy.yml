name: experimental-windows-child-process-policy
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/experimental-windows-child-process-policy.yml"
      - "scripts/experimental/*windows-child-process-policy*"
      - "test/fixtures/windows-child-process-policy*"
      - "test/fixtures/windows-child-process-policy-mock/**"
      - "test/unit/windows-child-process-policy*"
      - "test/integration/windows-child-process-policy-native.test.ts"
      - "test/unit/windows-child-process-policy-c-fault.test.ts"
permissions:
  contents: read
concurrency:
  group: experimental-windows-child-process-policy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  c-fault-logic:
    name: Linux C fault logic (not Windows native proof)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Exercise actual fixed C ownership/wipe failures using test-only API declarations
        run: npm test -- test/unit/windows-child-process-policy-c-fault.test.ts --maxWorkers=1
        env:
          EMBER_CHILD_POLICY_C_FAULT: "1"
  fixed-child-process-policy-prerequisite:
    if: github.event_name == 'workflow_dispatch' || github.head_ref != 'ember-improve/20261116-child-policy-detached-root'
    name: Fixed C child-process policy prerequisite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      EMBER_CHILD_POLICY_IMAGE: ${{ matrix.os }}
      EMBER_CHILD_POLICY_PROBE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Portable receipt, environment and terminal-owner contracts
        run: npm test -- test/unit/windows-child-process-policy test/unit/experimental-windows-lpac.test.ts test/unit/experimental-windows-lpac-api.test.ts --maxWorkers=1
      - name: Select the fresh fixed build root on the allocated runner
        shell: pwsh
        run: |
          $policyBuildRoot = Join-Path $env:RUNNER_TEMP 'ember-child-process-policy-build'
          "EMBER_CHILD_POLICY_BUILD_ROOT=$policyBuildRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile only the fixed repository C program
        timeout-minutes: 5
        run: node scripts/experimental/build-windows-child-process-policy.mjs --destination "$env:EMBER_CHILD_POLICY_BUILD_ROOT" --image "$env:EMBER_CHILD_POLICY_IMAGE"
      - name: Independent ordinary host and zero-capability LPAC child-policy API observations
        run: node scripts/run-integration.mjs test/integration/windows-child-process-policy-native.test.ts
      # No private paths, SIDs, handles, process IDs or raw native output are published.
      # Unsupported setter/direct routes remain inconclusive; no product backend or generic admission is enabled.
