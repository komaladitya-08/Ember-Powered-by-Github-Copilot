name: ci

on:
  push:
    branches: [main]
    # Release tags get every check, the Intel Mac job's included.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: "Upload the built packages as artifacts (RPM and AppImage, Windows zip, macOS zip and dmg; 200-400 MB each, kept 3 days)"
        type: boolean
        default: false
      intel:
        description: "Also build and check Ember on an Intel Mac (otherwise only on the default branch and tags: macOS minutes cost ten times Linux's)"
        type: boolean
        default: false
      only:
        description: "Run only one platform's jobs (pushes and pull requests always run them all; macOS minutes cost ten times Linux's)"
        type: choice
        options: [all, linux, windows, macos]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Accessibility sidecar self-test (stand-in pyatspi, no desktop)
        run: npm run test:sidecar
      - name: Speech models (cached; verified by SHA-256)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/voice
          key: voice-${{ hashFiles('app/voice/models.ts', 'scripts/voice/prepare.mjs') }}
      - run: node scripts/voice/prepare.mjs
      - name: Integration tests (real Copilot runtime with an offline mock model; real speech models)
        run: npm run test:integration
        env:
          EMBER_VOICE_TEST: "1"
      - run: npm run build
      - run: npm run build:lab
      - name: The built-in GitHub App client id starts a sign-in (GitHub answers with a device code, never printed)
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const id = fs.readFileSync("app/main/agent/github-app.ts", "utf8").match(/export const GITHUB_CLIENT_ID = "([^"]*)"/)?.[1] ?? "";
            if (!id) { console.log("no built-in client id (a fork or development build): nothing to check"); process.exit(0); }
            const res = await fetch("https://github.com/login/device/code", {
              method: "POST",
              headers: { accept: "application/json", "content-type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({ client_id: id, scope: "read:user" }),
            });
            const j = await res.json().catch(() => ({}));
            const ok = res.ok && typeof j.device_code === "string" && typeof j.user_code === "string";
            console.log(`GitHub answered ${res.status}: ${ok ? "a device code (not shown)" : JSON.stringify({ error: j.error, error_description: j.error_description })}`);
            process.exit(ok ? 0 : 1);
          '

  el8:
    name: RHEL 8 compatibility (rockylinux:8)
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: rockylinux:8
      # Lets Chromium use its user-namespace sandbox inside the container.
      options: --security-opt seccomp=unconfined
    steps:
      - name: System packages (build tools, Electron runtime libraries, Xvfb)
        run: |
          dnf -y -q --nobest install git tar xz file binutils findutils which sudo gcc-c++ make python3 \
            libX11-devel libXtst-devel libXt-devel \
            gtk3 nss alsa-lib mesa-libgbm libdrm libxkbcommon at-spi2-core at-spi2-atk cups-libs \
            libXtst libXrandr libXcomposite libXdamage \
            xorg-x11-server-Xvfb xorg-x11-xauth dbus-x11 mesa-dri-drivers dejavu-sans-fonts \
            python3-pyatspi python3-gobject
          useradd -m ci
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Rebuild native modules on glibc 2.28 and check every binary
        run: scripts/rebuild-el8.sh --here
      - name: Accessibility sidecar self-test on RHEL 8's platform-python (3.6), which installed Ember runs it with
        run: /usr/libexec/platform-python -B sidecar/atspi/test_ember_atspi.py
      - run: npm run build
      - name: Launch smoke test as a normal user (sandbox on)
        run: |
          chown -R ci .
          sudo -u ci env "PATH=$PATH" HOME=/home/ci xvfb-run -a npm run test:smoke
      - name: Launch smoke test from a folder whose name has %, #, &, brackets and non-ASCII in it (its pages must load there)
        run: sudo -u ci env "PATH=$PATH" HOME=/home/ci xvfb-run -a node test/smoke/launch.mjs --folder "Tools C# 100% Free 50%AB (x86) & Zoë's [x]"
      - name: Screen reading and acting on RHEL 8's Python 3.6 (AT-SPI sidecar, a worker against a GTK3 window, Ember's desk, hostile windows, Electron windows and their secret fields, a click that runs a modal dialog)
        run: |
          sudo -u ci env "PATH=$PATH" HOME=/home/ci EMBER_ATSPI_TEST=1 \
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" npm run test:integration -- test/integration/perception.test.ts test/integration/worker.test.ts test/integration/desk.test.ts test/integration/safety.test.ts test/integration/perception-electron.test.ts test/integration/action-link.test.ts test/integration/keybuffer-live.test.ts test/integration/overlay-shape-live.test.ts test/integration/handle-menu-live.test.ts test/integration/handle-card-whole-live.test.ts

  package:
    name: Package (RPM, AppImage) and install on rockylinux:8
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: rockylinux:8
      options: --security-opt seccomp=unconfined
    steps:
      - name: Build tools only (the RPM must bring in its own runtime dependencies)
        run: |
          dnf -y -q --nobest install git tar xz file binutils findutils which sudo gcc-c++ make python3 rpm-build \
            libX11-devel libXtst-devel libXt-devel xorg-x11-server-Xvfb xorg-x11-xauth dbus-x11 mesa-dri-drivers dejavu-sans-fonts
          useradd -m ci
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Rebuild native modules on glibc 2.28
        run: scripts/rebuild-el8.sh --here
      - run: npm run build
      # The real models, so rpm.sh builds the ember-voice-models package too (the release builds it).
      - name: Speech models (cached; verified by SHA-256)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/voice
          key: voice-${{ hashFiles('app/voice/models.ts', 'scripts/voice/prepare.mjs') }}
      - run: node scripts/voice/prepare.mjs
      - name: Stage the app and check every binary against RHEL 8.4's glibc
        run: |
          # The remote agent's parts for SSH targets (dist/remote-parts): stage.mjs ships them in resources/.
          node scripts/package/remote-parts.mjs
          node scripts/package/stage.mjs
          scripts/check-symvers.sh dist/package/ember | grep -v '^ok' || true
          scripts/check-symvers.sh dist/package/ember > /dev/null
      - name: Build the RPMs (Ember and its speech models)
        run: |
          scripts/package/rpm.sh
          ls dist/package/ember-voice-models-*.noarch.rpm
      - name: Build the AppImage
        run: scripts/package/appimage.sh
      - name: Install the RPM with dnf (resolves every Requires from the distribution)
        run: |
          dnf -y install ./dist/package/ember-*.x86_64.rpm
          rpm -q --requires ember | grep -v rpmlib
          stat -c '%A %U %n' /opt/ember/chrome-sandbox | grep -q '^-rwsr-xr-x root'
          test -x /usr/bin/ember && test -f /usr/share/applications/ember.desktop
          # The desktop entry is valid (desktop-file-utils comes with the RPM), with its Ask Ember action (D-45b).
          desktop-file-validate /usr/share/applications/ember.desktop
          grep -qx 'Exec=ember --ask' /usr/share/applications/ember.desktop
          # The desk helper ships beside main.cjs, and the installed binary can run it as plain Node.
          test -f /opt/ember/resources/app/dist/app/desk-agent.cjs
          ELECTRON_RUN_AS_NODE=1 /opt/ember/ember -e 'process.exit(0)'
      - name: "The installed Ember's fuses: no debugger, no NODE_OPTIONS; plain Node kept for the desk helper"
        run: |
          node scripts/package/fuses.mjs --check /opt/ember/ember
          # NODE_OPTIONS is ignored, also when Ember runs its desk helper as plain Node.
          ELECTRON_RUN_AS_NODE=1 NODE_OPTIONS=--require=/nonexistent/ember-fuse-check.js /opt/ember/ember -e 'process.exit(0)'
          # --inspect opens no debugger (and an installed Ember refuses to start with it).
          sudo -u ci env HOME=/home/ci xvfb-run -a sh -c 'timeout 25 ember --inspect=127.0.0.1:9229 > /tmp/inspect.log 2>&1; true'
          if grep -q 'Debugger listening' /tmp/inspect.log; then cat /tmp/inspect.log; exit 1; fi
          grep -q "doesn't start with debugging switches" /tmp/inspect.log || { cat /tmp/inspect.log; exit 1; }
      - name: The bundled licences are installed, and marked as licence files
        run: |
          test -s /opt/ember/THIRD_PARTY_NOTICES
          rpm -qL ember | grep -qx /opt/ember/THIRD_PARTY_NOTICES
          rpm -qL ember | grep -q 'sharp-libvips-linux-x64/README.md$'
          rpm -ql ember | grep -qx /usr/share/doc/ember
      - name: ember doctor (no display, then on a display)
        run: |
          sudo -u ci env HOME=/home/ci ember doctor || true
          # Without a display the check-up starts no GPU, so Chromium prints no GL errors over the report.
          if { sudo -u ci env HOME=/home/ci ember doctor 2>&1 || true; } | grep -E 'ANGLE|eglInitialize|GPU process'; then exit 1; fi
          sudo -u ci env HOME=/home/ci xvfb-run -a ember doctor || true
          sudo -u ci env HOME=/home/ci xvfb-run -a ember doctor | grep -q 'ok    Window sandbox'
      - name: The installed Ember starts and shows its window (as a normal user)
        run: |
          sudo -u ci env HOME=/home/ci EMBER_LOG_STDOUT=1 xvfb-run -a sh -c 'timeout 25 ember > /tmp/ember.log 2>&1; true'
          grep -q '"msg":"window.home.shown"' /tmp/ember.log || { cat /tmp/ember.log; exit 1; }
      - name: "STIG-like host (user namespaces off): the setuid sandbox helper is in place"
        # The container can't turn off the host's user namespaces; this checks what Chromium falls back to.
        run: stat -c '%a %U' /opt/ember/chrome-sandbox | grep -qx '4755 root'
      - name: "RPM lifecycle: the speech models package, an upgrade to Release 2, rpm -V, and removal that keeps the admin's policy"
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          # The models package needs the Ember it was built with (Requires: ember = version-release).
          dnf -y install ./dist/package/ember-voice-models-$v-1.*.noarch.rpm
          test -f /usr/share/ember/voice-models/silero_vad.onnx
          rpm -V ember ember-voice-models
          # An administrator's policy: no package owns it, so an upgrade and a removal leave it as it is.
          cp packaging/policy.example.json /etc/ember/policy.json
          EMBER_RPM_RELEASE=2 scripts/package/rpm.sh
          dnf -y upgrade ./dist/package/ember-$v-2.*.x86_64.rpm ./dist/package/ember-voice-models-$v-2.*.noarch.rpm
          test "$(rpm -q --qf '%{RELEASE}' ember | cut -d. -f1)" = 2
          test "$(rpm -q --qf '%{RELEASE}' ember-voice-models | cut -d. -f1)" = 2
          rpm -V ember ember-voice-models
          stat -c '%a %U' /opt/ember/chrome-sandbox | grep -qx '4755 root'
          cmp packaging/policy.example.json /etc/ember/policy.json
          rpm -e ember ember-voice-models
          for p in /opt/ember /usr/share/ember /usr/bin/ember /usr/share/applications/ember.desktop /usr/share/doc/ember; do
            if [ -e "$p" ]; then echo "::error::$p is still there after rpm -e"; find "$p" | head -20; exit 1; fi
          done
          cmp packaging/policy.example.json /etc/ember/policy.json
          if rpm -qf /etc/ember/policy.json; then echo "::error::a package owns /etc/ember/policy.json"; exit 1; fi
          # The packages kept for download are Release 1's.
          rm -f ./dist/package/ember-$v-2.*.rpm ./dist/package/ember-voice-models-$v-2.*.rpm
      # The packages are about 450 MB with the speech models, so they're kept only when asked for (Run workflow,
      # "packages") and on release tags, for the release job: uploading them on every run filled the account's artifact
      # storage, after which no artifact could be uploaded at all.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: (github.event_name == 'workflow_dispatch' && inputs.packages) || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        with:
          name: ember-packages
          path: |
            dist/package/*.rpm
            dist/package/*.AppImage
          retention-days: 3

  eval:
    name: Evaluation (task suite and release gates, rockylinux:8)
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: rockylinux:8
      options: --security-opt seccomp=unconfined
    steps:
      - name: System packages (as el8, plus gedit and dconf for the task suite)
        run: |
          dnf -y -q --nobest install git tar xz bzip2 file binutils findutils which sudo gcc-c++ make python3 \
            libX11-devel libXtst-devel libXt-devel \
            gtk3 nss alsa-lib mesa-libgbm libdrm libxkbcommon at-spi2-core at-spi2-atk cups-libs \
            libXtst libXrandr libXcomposite libXdamage \
            xorg-x11-server-Xvfb xorg-x11-xauth dbus-x11 mesa-dri-drivers dejavu-sans-fonts \
            python3-pyatspi python3-gobject gedit dconf gsettings-desktop-schemas
          useradd -m ci
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Rebuild native modules on glibc 2.28
        run: scripts/rebuild-el8.sh --here
      - name: Speech models (cached; verified by SHA-256)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/voice
          key: voice-${{ hashFiles('app/voice/models.ts', 'scripts/voice/prepare.mjs') }}
      - run: node scripts/voice/prepare.mjs
      - name: Task suite (scripted model) and release gates, as a normal user
        run: |
          chown -R ci .
          sudo -u ci env "PATH=$PATH" HOME=/home/ci \
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" node eval/run.mjs --out dist/eval
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        continue-on-error: true
        with:
          name: ember-eval
          path: dist/eval/
          retention-days: 30

  windows:
    name: Windows (unit tests, build, smoke, UI Automation, zip)
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'windows'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash with -eo pipefail: any failing command fails the step (pwsh would check only the last one).
        shell: bash
    steps:
      - name: Runner facts (Windows edition and build, elevation, UAC, screens, PowerShell), exported for the integration suites
        # windows-2022 is Windows Server 2022 21H2, run elevated (its shell, explorer.exe, too) with EnableLUA 1, one
        # 1024x768 screen at 100 % and no Store apps. The suites read EMBER_CI_ELEVATED, EMBER_CI_LUA and EMBER_CI_SERVER
        # and record "not testable on this runner" for what needs a client Windows or a normal user, instead of passing it.
        shell: powershell -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $os = Get-CimInstance Win32_OperatingSystem
          $nt = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"
          "Windows: $($os.Caption) $($nt.DisplayVersion) build $($os.BuildNumber).$($nt.UBR), product type $($os.ProductType) (1 is a client); $([Environment]::OSVersion.VersionString)"
          $groups = whoami /groups | Out-String
          if ($LASTEXITCODE -ne 0) { throw "whoami /groups failed" }
          # The mandatory label: S-1-16-8192 medium, 12288 high (elevated), 16384 system.
          $level = [regex]::Match($groups, "S-1-16-(\d+)").Groups[1].Value
          if (-not $level) { throw "whoami /groups shows no integrity level" }
          $elevated = if ([int]$level -ge 12288) { 1 } else { 0 }
          "Integrity level: S-1-16-$level (elevated: $elevated)"
          $lua = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -ErrorAction SilentlyContinue).EnableLUA
          if ($null -eq $lua) { "EnableLUA: absent (UAC on, the default)"; $lua = 1 } else { "EnableLUA: $lua" }
          $server = if ($os.ProductType -ne 1) { 1 } else { 0 }
          Add-Type -AssemblyName System.Windows.Forms
          foreach ($screen in [System.Windows.Forms.Screen]::AllScreens) {
            $b = $screen.Bounds
            "Screen $($screen.DeviceName): $($b.Width)x$($b.Height) at $($b.X),$($b.Y)$(if ($screen.Primary) { ' (primary)' })"
          }
          "Applied DPI: $((Get-ItemProperty 'HKCU:\Control Panel\Desktop\WindowMetrics' -ErrorAction SilentlyContinue).AppliedDPI) (96 is 100 %)"
          "Windows PowerShell $($PSVersionTable.PSVersion), language mode $($ExecutionContext.SessionState.LanguageMode); execution policies:"
          Get-ExecutionPolicy -List | Format-Table -AutoSize | Out-String
          # Appended without a byte-order mark (Out-File -Encoding utf8 writes one in Windows PowerShell 5.1).
          $facts = "EMBER_CI_ELEVATED=$elevated`nEMBER_CI_LUA=$([int]$lua)`nEMBER_CI_SERVER=$server`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $facts)
          $facts
      - name: Keep LF line endings in the checkout (as .gitattributes says)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The UI Automation bridge compiles and starts as Ember starts it, and stops when its input closes
        # Ember's accessibility host runs this command line: Windows PowerShell 5.1 (not pwsh), whose Add-Type compiles
        # ember_uia.cs with .NET Framework's C# 5 compiler into EMBER_UIA_CACHE, the assemblies loaded as the bootstrap
        # loads them, and PSModulePath only the system modules folder (no user or runner modules; design departure 3).
        # Run twice: compiled into the cache (the build named after the source's SHA-256, its own hash beside it), then
        # loaded from it without compiling again. With stdin closed it must print its ready line and exit 0.
        timeout-minutes: 5
        run: |
          powershell="$(cygpath -W)/System32/WindowsPowerShell/v1.0/powershell.exe"
          modules="$(cygpath -w -W)\System32\WindowsPowerShell\v1.0\Modules"
          script="$(cygpath -w "$PWD/sidecar/uia/ember_uia.ps1")"
          temp="$(cygpath -u "$RUNNER_TEMP")"
          cache="$temp/uia"
          rm -rf "$cache"
          EMBER_UIA_CACHE="$(cygpath -w "$cache")"
          export EMBER_UIA_CACHE
          dll="$cache/ember_uia-$(sha256sum sidecar/uia/ember_uia.cs | cut -d ' ' -f 1).dll"
          compiled="$temp/uia-compiled.mark"
          for pass in compiled cached; do
            started=$(date +%s%3N)
            if ! out=$(env -u PSMODULEPATH PSModulePath="$modules" "$powershell" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$script" < /dev/null); then
              printf '%s\n' "$out"
              echo "the bridge failed ($pass)"
              exit 1
            fi
            # The first line must be the ready line, {"ready":true,...}; a fatal line means it couldn't start.
            node -e 'const [line, pass] = process.argv.slice(1); let j; try { j = JSON.parse(line); } catch {} if (j?.ready !== true) { console.error("no ready line (" + pass + "): " + line); process.exit(1); } console.log(pass + ": " + line)' "$(printf '%s\n' "$out" | head -n 1)" "$pass"
            if [ "$pass" = compiled ]; then
              # The whole build is in the cache: a temporary file left behind, or a build run from memory, isn't.
              if [ ! -f "$dll" ] || [ ! -f "$dll.sha256" ]; then echo "nothing was compiled into $EMBER_UIA_CACHE"; ls -la "$cache" || true; exit 1; fi
              if [ "$(sha256sum "$dll" | cut -d ' ' -f 1)" != "$(tr -d '\r\n ' < "$dll.sha256")" ]; then echo "the cached build doesn't match its hash"; exit 1; fi
              touch "$compiled"
            elif [ -n "$(find "$cache" -name 'ember_uia-*' -newer "$compiled")" ]; then
              echo "the second start compiled again instead of loading the cached build:"; ls -la --full-time "$cache"; exit 1
            fi
            echo "$pass: started and exited in $(( $(date +%s%3N) - started )) ms"
          done
      - name: Launch smoke test (development build)
        run: npm run test:smoke
      - name: Launch smoke test from a folder whose name has %, #, & and brackets in it (its pages must load there)
        run: node test/smoke/launch.mjs --folder "Tools C# 100% Free 50%AB (x86) & Jo's [x]"
      - name: Desktop integration tests (window system and input, UI Automation bridge, accessibility host, system integration, vocabularies)
        run: >-
          node scripts/run-integration.mjs test/integration/win32-desktop.test.ts test/integration/uia-bridge.test.ts
          test/integration/ax-sidecar.test.ts test/integration/win32-system.test.ts test/integration/win32-vocabulary.test.ts
        env:
          EMBER_WIN32_TEST: "1"
          EMBER_UIA_TEST: "1"
          EMBER_WINSYS_TEST: "1"
      - name: Stage Ember (Ember.exe with its own version resource and icon) and zip it
        # Runs after a failed integration step too (the job stays failed): the package's checks don't depend on it.
        if: ${{ !cancelled() }}
        run: |
          # The remote agent's parts for SSH targets (dist/remote-parts): stage.mjs ships them in resources/.
          node scripts/package/remote-parts.mjs
          node scripts/package/stage.mjs
          node scripts/package/archive.mjs
      - name: "The packaged Ember: its fuses, plain Node kept, NODE_OPTIONS ignored, --inspect refused, its files"
        if: ${{ !cancelled() }}
        run: |
          app=dist/package/Ember
          export EMBER_USER_DATA="$RUNNER_TEMP/ember-checks"
          node scripts/package/fuses.mjs --check "$app/Ember.exe"
          # The accessibility host runs as Ember.exe in node mode; NODE_OPTIONS is ignored there too.
          ELECTRON_RUN_AS_NODE=1 "$app/Ember.exe" -e "process.exit(0)"
          ELECTRON_RUN_AS_NODE=1 NODE_OPTIONS=--require=C:/nonexistent/ember-fuse-check.js "$app/Ember.exe" -e "process.exit(0)"
          # --inspect opens no debugger, and a packaged Ember refuses to start with it (exit 2).
          node -e 'const r = require("child_process").spawnSync(process.argv[1], ["--inspect=127.0.0.1:9229"], { encoding: "utf8", timeout: 60000 }); console.log(r.stdout + r.stderr + "\nexit " + r.status)' "$app/Ember.exe" > inspect.log
          if grep -q 'Debugger listening' inspect.log; then cat inspect.log; exit 1; fi
          if ! grep -q "doesn't start with debugging switches" inspect.log || ! grep -qx 'exit 2' inspect.log; then cat inspect.log; exit 1; fi
          test -s "$app/THIRD_PARTY_NOTICES" && test -f "$app/LICENSES.chromium.html" && test -f "$app/LICENSE"
          test -f "$app/resources/ember.ico" && test ! -e "$app/resources/default_app.asar"
          test ! -e "$app/resources/app/dist/app/desk-agent.cjs"
          test -f "$app/resources/app/dist/app/ax-sidecar.cjs"
          test -f "$app/resources/sidecar/uia/ember_uia.ps1" && test -f "$app/resources/sidecar/uia/ember_uia.cs"
      - name: "Ember.exe as Windows sees it: Ember's name, version and publisher, and unsigned rather than tampered with"
        if: ${{ !cancelled() }}
        # Task Manager (and its Startup apps page), the privacy settings, the volume mixer and firewall prompts show
        # these strings. stage.mjs leaves out Electron's certificate table, which the changes void: NotSigned, never
        # HashMismatch.
        shell: powershell -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-Item dist/package/Ember/Ember.exe
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $v = $exe.VersionInfo
          $v | Format-List FileDescription, ProductName, CompanyName, OriginalFilename, InternalName, FileVersion, ProductVersion, LegalCopyright | Out-String
          $want = [ordered]@{ FileDescription = "Ember"; ProductName = "Ember"; CompanyName = $pkg.author; OriginalFilename = "Ember.exe"; InternalName = "Ember.exe"; FileVersion = $pkg.version; ProductVersion = $pkg.version }
          foreach ($key in $want.Keys) { if ($v.$key -ne $want[$key]) { throw "Ember.exe's $key is '$($v.$key)', should be '$($want[$key])'" } }
          $fixed = "$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart)"
          if ($fixed -ne ($pkg.version -replace '[-+].*$', '')) { throw "Ember.exe's file version number is $fixed, should be $($pkg.version)" }
          $signature = Get-AuthenticodeSignature $exe.FullName
          "Authenticode: $($signature.Status)"
          if ([string]$signature.Status -ne "NotSigned") { throw "Ember.exe's signature is $($signature.Status), should be NotSigned (no certificate table)" }
      - name: The packaged Ember starts, shows its window and holds all its shortcuts
        if: ${{ !cancelled() }}
        # Server 2022 has neither PowerToys nor Game Bar, so nothing else holds Ember's chords: one reported taken means
        # Electron couldn't register it (with Ember's Windows chords, that Super isn't the Windows key to RegisterHotKey).
        run: node test/smoke/launch.mjs --exe dist/package/Ember/Ember.exe --forbid shortcut.unavailable
      - name: "Ember's check-up from the packaged Ember.exe: its helper reads apps, its input works, its Copilot runtime is there"
        if: ${{ !cancelled() }}
        # The report decides, not the exit code: on this runner Ember runs as administrator (a warning row) and isn't
        # signed in to GitHub (a warning row). "Copilot" failing would mean the runtime is missing from the package.
        timeout-minutes: 5
        run: |
          report="$RUNNER_TEMP/doctor.txt"
          status=0
          dist/package/Ember/Ember.exe --doctor > "$report" 2> "$RUNNER_TEMP/doctor.err" || status=$?
          cat "$report"
          echo "exit status $status"
          if [ "$EMBER_CI_ELEVATED" = 1 ]; then admin=warn; else admin=ok; fi
          node scripts/package/doctor-rows.mjs "$report" "Transparent windows=ok" "Accessibility helper=ok" "Mouse and keyboard=ok" "PowerShell=ok" "Helper command line=ok" "Administrator=$admin" "Copilot=warn" "Organisation policy=ok" || { cat "$RUNNER_TEMP/doctor.err"; exit 1; }
          # ember-doctor.cmd, what a user runs in a console: cmd.exe waits for Ember.exe and keeps its exit code. (Its
          # report goes to the console cmd.exe has, which this runner's pipes aren't: only the line count is shown.)
          launcher=dist/package/Ember/ember-doctor.cmd
          test -f "$launcher"
          cmdstatus=0
          cmd //d //c "$(cygpath -w "$launcher")" > "$RUNNER_TEMP/doctor-cmd.txt" 2>&1 || cmdstatus=$?
          echo "ember-doctor.cmd: exit status $cmdstatus, $(grep -c '' "$RUNNER_TEMP/doctor-cmd.txt") lines of output"
          test "$cmdstatus" = "$status"
          # Both 0 proves little (a launcher that never ran Ember.exe gives 0 too): with an organisation policy that
          # isn't JSON the check-up fails (exit 1), and ember-doctor.cmd must give 1 as well. HKLM needs an administrator.
          if [ "$EMBER_CI_ELEVATED" = 1 ]; then
            key='HKLM\SOFTWARE\Policies\Ember'
            trap 'MSYS_NO_PATHCONV=1 reg delete "$key" /f /reg:64 > /dev/null 2>&1 || true' EXIT
            MSYS_NO_PATHCONV=1 reg add "$key" /v PolicyJson /t REG_SZ /d "{" /f /reg:64 > /dev/null
            failing=0
            dist/package/Ember/Ember.exe --doctor > "$RUNNER_TEMP/doctor-locked.txt" 2>&1 || failing=$?
            node scripts/package/doctor-rows.mjs "$RUNNER_TEMP/doctor-locked.txt" "Organisation policy=fail"
            cmdfailing=0
            cmd //d //c "$(cygpath -w "$launcher")" > /dev/null 2>&1 || cmdfailing=$?
            echo "with a policy that isn't JSON: Ember.exe --doctor exit status $failing, ember-doctor.cmd exit status $cmdfailing"
            test "$failing" = 1
            test "$cmdfailing" = 1
          else
            echo "not testable on this runner: ember-doctor.cmd keeping a failing exit code: writing HKLM's policy needs an administrator"
          fi
      - name: "Ember-level checks: Ember's composition and Perception against the bench, its overlay out of screenshots, the packaged host"
        if: ${{ !cancelled() }}
        run: node scripts/run-integration.mjs test/integration/ember-win32.test.ts
        env:
          EMBER_WIN32_TEST: "1"
          EMBER_PACKAGED_APP: dist/package/Ember
      # Large: kept only when asked for, like the Linux packages.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: (github.event_name == 'workflow_dispatch' && inputs.packages) || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        with:
          name: ember-windows
          path: dist/package/*.zip
          retention-days: 3

  macos:
    name: macOS (unit tests, build, smoke, accessibility, Ember itself, app bundle)
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'macos'
    # Kept lean: macOS minutes cost ten times Linux's on a private repository. Every check after the build runs even
    # when an earlier one failed (!cancelled()), so one run shows them all.
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Runner facts (macOS version, architecture, SIP, screens, the TCC grants the image already has)
        run: |
          sw_vers
          echo "architecture: $(uname -m)"
          csrutil status || true
          system_profiler SPDisplaysDataType 2>/dev/null | grep -E 'Resolution|Main Display' || true
          services="'kTCCServiceAccessibility','kTCCServiceScreenCapture','kTCCServicePostEvent','kTCCServiceListenEvent','kTCCServiceAppleEvents'"
          query="SELECT service, client, client_type, auth_value, length(csreq), indirect_object_identifier, length(indirect_object_code_identity) FROM access WHERE service IN ($services) ORDER BY service, client;"
          echo "The image's grants, system database:"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "$query" || echo "(unreadable)"
          echo "The image's grants, user database:"
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "$query" || echo "(unreadable)"
      - name: No crash dialogs on screen (an app that dies would leave one over every later test)
        # The system's "… quit unexpectedly" alert is UserNotificationCenter's, which Ember counts as a security prompt
        # (no screenshots while it is up). Crash reports are still written, and the suites print them.
        run: defaults write com.apple.CrashReporter DialogType none
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm test
      - id: build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Launch smoke test (development build)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:smoke
      - name: Launch smoke test from a folder whose name has %, #, &, brackets and non-ASCII in it (its pages must load there)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node test/smoke/launch.mjs --folder "Tools C# 100% Free 50%AB (x86) & Zoë's [x]"
      - name: Grant the processes that may be TCC's responsible one, and approve their screen capture
        id: grant
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # Which process macOS holds responsible for a CI job isn't certain, so every candidate is granted (scripts/
        # package/tcc.mjs): Accessibility, Screen Recording, Input Monitoring (posting and listening to events) and
        # Apple Events to System Events, for the development Electron, node, the shells and the runner's own
        # processes. Not Ember.app: its grant comes after the first attribution check below. macOS 15 puts up an alert
        # before an unapproved binary captures the screen, which nobody answers here. The tests print
        # AXIsProcessTrusted() and fail loudly without the grant.
        run: |
          electron="$GITHUB_WORKSPACE/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron"
          node scripts/package/tcc.mjs grant-paths --ancestors "$electron" "$(command -v node)" /bin/bash /bin/zsh
          node scripts/package/tcc.mjs approve-capture "$electron" "$GITHUB_WORKSPACE/dist/package/Ember.app/Contents/MacOS/Ember" "$(command -v node)"
          node scripts/package/tcc.mjs show
      - name: "Window system and input (darwin-desktop: the AppKit bench, TextEdit)"
        if: ${{ !cancelled() && steps.grant.outcome == 'success' }}
        run: node scripts/run-integration.mjs test/integration/darwin-desktop.test.ts
        env:
          EMBER_DARWIN_TEST: "1"
      - name: "Accessibility host on the AX provider (ax-sidecar-darwin: the AppKit bench)"
        if: ${{ !cancelled() && steps.grant.outcome == 'success' }}
        run: node scripts/run-integration.mjs test/integration/ax-sidecar-darwin.test.ts
        env:
          EMBER_AX_TEST: "1"
      - name: "System integration and vocabularies (darwin-system, darwin-vocabulary)"
        if: ${{ !cancelled() && steps.grant.outcome == 'success' }}
        run: node scripts/run-integration.mjs test/integration/darwin-system.test.ts test/integration/darwin-vocabulary.test.ts
        env:
          EMBER_MACSYS_TEST: "1"
      - name: Stage Ember.app (signed ad hoc), zip it and make the disk image
        id: stage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          # The remote agent's parts for SSH targets (dist/remote-parts): stage.mjs ships them in resources/.
          node scripts/package/remote-parts.mjs
          node scripts/package/stage.mjs
          node scripts/package/archive.mjs
      - name: "The packaged Ember.app: its fuses, its signature, node mode refused, NODE_OPTIONS fuse off, --inspect refused (so it knows it's packaged)"
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: |
          app=dist/package/Ember.app
          exe="$app/Contents/MacOS/Ember"
          export EMBER_USER_DATA="$RUNNER_TEMP/ember-checks"
          node scripts/package/fuses.mjs --check "$app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          codesign --verify --deep --strict --verbose=2 "$app"
          # The hardened runtime (review #177): its flag on Ember's signature, whatever SIP says.
          codesign --display --verbose=2 "$app" 2>&1 | grep -E 'flags=0x[0-9a-f]+\([^)]*runtime'
          # With it, macOS ignores DYLD_* for Ember, so a library named there isn't loaded (dyld would stop Ember
          # otherwise: the library doesn't exist), and Ember gets as far as refusing --inspect (exit 2). Only where SIP is
          # on, as on users' Macs: these runners report it off, and with it off dyld may honour DYLD_* for any binary, so
          # the line would prove nothing here.
          if [[ "$(csrutil status 2>&1)" == *"status: enabled"* ]]; then
            status=0
            DYLD_INSERT_LIBRARIES=/nonexistent/ember-dyld-check.dylib "$exe" --inspect=127.0.0.1:9229 || status=$?
            test "$status" -eq 2
          else
            echo "::notice::SIP is off on this runner: the DYLD_* check can't prove anything here"
          fi
          # Node mode is refused (review #177: RunAsNode is off on macOS). Given ELECTRON_RUN_AS_NODE=1, Ember's binary
          # still starts as Ember, which stops at once on --inspect (exit 2, its message), and never runs the script it
          # is given, which would leave the mark.
          mark="$RUNNER_TEMP/ember-node-mode-mark"
          echo 'require("fs").writeFileSync(process.env.EMBER_MARK, "node mode")' > "$RUNNER_TEMP/ember-node-mode.js"
          rm -f "$mark"
          node -e 'const r = require("child_process").spawnSync(process.argv[1], ["--inspect=127.0.0.1:9229", process.argv[2]], { encoding: "utf8", timeout: 60000, env: { ...process.env, ELECTRON_RUN_AS_NODE: "1", EMBER_MARK: process.argv[3] } }); console.log(r.stdout + r.stderr + "\nexit " + r.status)' "$exe" "$RUNNER_TEMP/ember-node-mode.js" "$mark" > node-mode.log
          if [ -e "$mark" ] || ! grep -q "doesn't start with debugging switches" node-mode.log || ! grep -qx 'exit 2' node-mode.log; then cat node-mode.log; exit 1; fi
          echo "Node mode refused: Ember started as itself, refused --inspect (exit 2) and left no mark"
          # NODE_OPTIONS: a packaged Electron drops all but two NODE_OPTIONS in app mode (and in its utility processes)
          # whatever the fuse says, and node mode is refused, so no run can show the fuse here. `fuses.mjs --check` above
          # (EnableNodeOptionsEnvironmentVariable off) is the proof. This run only shows that --inspect is still refused
          # with it set.
          node -e 'const r = require("child_process").spawnSync(process.argv[1], ["--inspect=127.0.0.1:9229"], { encoding: "utf8", timeout: 60000, env: { ...process.env, NODE_OPTIONS: "--require=/nonexistent/ember-fuse-check.js" } }); console.log(r.stdout + r.stderr + "\nexit " + r.status)' "$exe" > inspect.log
          if grep -q 'Debugger listening' inspect.log; then cat inspect.log; exit 1; fi
          if ! grep -q "doesn't start with debugging switches" inspect.log || ! grep -qx 'exit 2' inspect.log; then cat inspect.log; exit 1; fi
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = io.github.komaladitya08.ember
          test "$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")" = Ember && test ! -e "$app/Contents/MacOS/Electron"
          plutil -extract NSMicrophoneUsageDescription raw -o - "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/THIRD_PARTY_NOTICES" && test -f "$app/Contents/Resources/LICENSES.chromium.html" && test -f "$app/Contents/Resources/LICENSE"
          test -f "$app/Contents/Resources/ember.icns" && test ! -e "$app/Contents/Resources/default_app.asar"
          test ! -e "$app/Contents/Resources/app/dist/app/desk-agent.cjs"
          test -f "$app/Contents/Resources/app/dist/app/ax-sidecar.cjs"
      - name: The packaged Ember.app starts and shows its window
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: node test/smoke/launch.mjs --exe dist/package/Ember.app/Contents/MacOS/Ember
      - name: "Ember itself: start beside the user's app (M1), the ask box (M2), screenshots, the overlay, the packaged host"
        if: ${{ !cancelled() && steps.grant.outcome == 'success' && steps.stage.outcome == 'success' }}
        run: node scripts/run-integration.mjs test/integration/ember-darwin.test.ts
        env:
          EMBER_DARWIN_TEST: "1"
          EMBER_PACKAGED_APP: dist/package/Ember.app
      - name: "SSH's askpass as Ember itself (askpass-darwin: ssh-add unlocks a key through the development Electron and Ember.app, no Dock icon)"
        # The macOS build refuses node mode (review #177), so ssh's askpass wrapper starts Ember in its askpass mode.
        # It needs no permission: run before Ember.app's own grant.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.stage.outcome == 'success' }}
        run: node scripts/run-integration.mjs test/integration/askpass-darwin.test.ts
        env:
          EMBER_DARWIN_TEST: "1"
          EMBER_PACKAGED_APP: dist/package/Ember.app
      - name: "Input Monitoring evidence (design Q10): does key-state polling see another process's key without the grant?"
        # Every Input Monitoring (listen) row is set aside for one test, which prints its verdict (it asserts only with
        # the grant), and put back after. Nothing asks for the permission: a prompt would sit over the later steps.
        if: ${{ !cancelled() && steps.grant.outcome == 'success' }}
        run: |
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          rows="$RUNNER_TEMP/listen-rows.sql"
          sudo sqlite3 "$db" ".mode insert access" "SELECT * FROM access WHERE service='kTCCServiceListenEvent'" > "$rows"
          echo "Input Monitoring rows set aside: $(grep -c . "$rows")"
          # The rows come back whatever happens below (the steps after need the grant).
          restore() {
            sudo sqlite3 "$db" "DELETE FROM access WHERE service='kTCCServiceListenEvent'"
            sudo sqlite3 "$db" < "$rows"
            sudo launchctl kickstart -k system/com.apple.tccd.system || sudo pkill -x tccd || true
            echo "Input Monitoring rows back: $(sudo sqlite3 "$db" "SELECT count(*) FROM access WHERE service='kTCCServiceListenEvent'")"
          }
          trap restore EXIT
          sudo sqlite3 "$db" "DELETE FROM access WHERE service='kTCCServiceListenEvent'"
          sudo launchctl kickstart -k system/com.apple.tccd.system || sudo pkill -x tccd
          sleep 2
          echo "Input Monitoring rows now: $(sudo sqlite3 "$db" "SELECT count(*) FROM access WHERE service='kTCCServiceListenEvent'") (system), $(sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "SELECT count(*) FROM access WHERE service='kTCCServiceListenEvent'" || echo '?') (user)"
          EMBER_DARWIN_TEST=1 node scripts/run-integration.mjs test/integration/darwin-desktop.test.ts -t "sees a key another process holds down"
      - name: "Attribution, before Ember.app's grant: opened as users open it, Ember can't read apps (nothing is borrowed from the runner's granted processes)"
        # Started through LaunchServices, Ember.app is its own responsible process to TCC, as when a user opens it; the
        # tests above ran under the runner's processes, whose grants prove nothing about Ember's.
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          report="$RUNNER_TEMP/doctor-before.txt"
          : > "$report"
          # The check-up exits 1 on any failing row, as the run before the grant must: the report decides, not open's status.
          open -n -W --stdout "$report" --stderr "$RUNNER_TEMP/doctor-before.err" -a "$PWD/dist/package/Ember.app" --args --doctor || echo "open exited with status $?"
          cat "$report"
          node scripts/package/doctor-rows.mjs "$report" "Reading and using apps=fail" "Accessibility helper=fail" || { cat "$RUNNER_TEMP/doctor-before.err"; exit 1; }
      - name: Grant Ember.app by its bundle id, with its real code requirement
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: |
          node scripts/package/tcc.mjs grant-bundle dist/package/Ember.app
          node scripts/package/tcc.mjs show
      - name: "Attribution, after: the grant reaches Ember and the accessibility helper it starts; the packaged Copilot runtime is found"
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          report="$RUNNER_TEMP/doctor-after.txt"
          : > "$report"
          # The check-up exits 1 on any failing row, as the run before the grant must: the report decides, not open's status.
          open -n -W --stdout "$report" --stderr "$RUNNER_TEMP/doctor-after.err" -a "$PWD/dist/package/Ember.app" --args --doctor || echo "open exited with status $?"
          cat "$report"
          # Copilot warns (not signed in on a runner) rather than failing: a missing runtime is the failure.
          node scripts/package/doctor-rows.mjs "$report" "Reading and using apps=ok" "Accessibility helper=ok" "Copilot=warn" || { cat "$RUNNER_TEMP/doctor-after.err"; exit 1; }
      - name: "Input Monitoring evidence (Q10), as Ember sees it: Ember.app with Accessibility but no Input Monitoring row of its own"
        # Prints what Ember's check-up says of Input Monitoring once the bundle's listen row is gone (the evidence the
        # suites can't give: their processes need Accessibility to post the key they look for), then puts it back.
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          bundle=$(plutil -extract CFBundleIdentifier raw -o - dist/package/Ember.app/Contents/Info.plist)
          rows="$RUNNER_TEMP/ember-listen-row.sql"
          sudo sqlite3 "$db" ".mode insert access" "SELECT * FROM access WHERE service='kTCCServiceListenEvent' AND client='$bundle'" > "$rows"
          restore() {
            sudo sqlite3 "$db" < "$rows"
            sudo launchctl kickstart -k system/com.apple.tccd.system || sudo pkill -x tccd || true
          }
          trap restore EXIT
          sudo sqlite3 "$db" "DELETE FROM access WHERE service='kTCCServiceListenEvent' AND client='$bundle'"
          sudo launchctl kickstart -k system/com.apple.tccd.system || sudo pkill -x tccd
          sleep 2
          echo "Ember.app's rows now: $(sudo sqlite3 "$db" "SELECT group_concat(service, ', ') FROM access WHERE client='$bundle'")"
          report="$RUNNER_TEMP/doctor-q10.txt"
          : > "$report"
          open -n -W --stdout "$report" --stderr "$RUNNER_TEMP/doctor-q10.err" -a "$PWD/dist/package/Ember.app" --args --doctor || echo "open exited with status $?"
          grep -E '^(ok|warn|FAIL) +(Accessibility|Input Monitoring|Mouse and keyboard)' "$report" || { cat "$report" "$RUNNER_TEMP/doctor-q10.err"; exit 1; }
      - name: What the system said when something failed (crash reports, alerts)
        if: failure()
        continue-on-error: true
        run: |
          ls -lt "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -20 || true
          /usr/bin/log show --last 15m --style compact --predicate 'process == "UserNotificationCenter" OR process == "ReportCrash"' 2>/dev/null | tail -60 || true
      # Large: kept only when asked for, like the Linux packages.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: (github.event_name == 'workflow_dispatch' && inputs.packages) || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        with:
          name: ember-macos
          path: |
            dist/package/*.zip
            dist/package/*.dmg
          retention-days: 3

  macos-x64:
    name: macOS on Intel (build, app bundle, smoke, window system and input)
    # macos-15 above is Apple silicon only, and stage.mjs stages for the machine it runs on, so the x64 Ember.app is
    # built here. macOS minutes cost ten times Linux's: this runs on the default branch, on tags, and when asked.
    if: >-
      (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')))
      || (github.event_name == 'workflow_dispatch' && inputs.intel && (inputs.only == 'all' || inputs.only == 'macos'))
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Runner facts (macOS version, architecture)
        run: |
          sw_vers
          echo "architecture: $(uname -m)"
          test "$(uname -m)" = x86_64
      - name: No crash dialogs on screen (an app that dies would leave one over every later test)
        run: defaults write com.apple.CrashReporter DialogType none
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run build
      - name: Grant the processes that may be TCC's responsible one, and approve their screen capture
        run: |
          electron="$GITHUB_WORKSPACE/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron"
          node scripts/package/tcc.mjs grant-paths --ancestors "$electron" "$(command -v node)" /bin/bash /bin/zsh
          node scripts/package/tcc.mjs approve-capture "$electron" "$GITHUB_WORKSPACE/dist/package/Ember.app/Contents/MacOS/Ember" "$(command -v node)"
          node scripts/package/tcc.mjs show
      - name: Window system and input on Intel (the accessibility host is checked on Apple silicon)
        run: node scripts/run-integration.mjs test/integration/darwin-desktop.test.ts
        env:
          EMBER_DARWIN_TEST: "1"
      - name: Stage Ember.app for x64 (signed ad hoc), zip it and make the disk image
        run: |
          # The remote agent's parts for SSH targets (dist/remote-parts): stage.mjs ships them in resources/.
          node scripts/package/remote-parts.mjs
          node scripts/package/stage.mjs
          node scripts/package/archive.mjs
      - name: "The packaged Ember.app on Intel: every binary runs on x86_64, its fuses, its signature, node mode refused, NODE_OPTIONS fuse off, --inspect refused"
        run: |
          app=dist/package/Ember.app
          exe="$app/Contents/MacOS/Ember"
          export EMBER_USER_DATA="$RUNNER_TEMP/ember-checks"
          # Every Mach-O file in the bundle (Electron, its helpers and frameworks, koffi, sharp, the Copilot runtime).
          machos=0
          while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in
              *Mach-O*)
                machos=$((machos + 1))
                archs=$(lipo -archs "$f")
                case " $archs " in *" x86_64 "*) ;; *) echo "$f: $archs (no x86_64)"; exit 1 ;; esac ;;
            esac
          done < <(find "$app" -type f -print0)
          echo "$machos Mach-O files, each with x86_64"
          test "$machos" -gt 0
          node scripts/package/fuses.mjs --check "$app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          codesign --verify --deep --strict --verbose=2 "$app"
          # The hardened runtime (review #177): its flag on Ember's signature, whatever SIP says.
          codesign --display --verbose=2 "$app" 2>&1 | grep -E 'flags=0x[0-9a-f]+\([^)]*runtime'
          # With it, macOS ignores DYLD_* for Ember, so a library named there isn't loaded (dyld would stop Ember
          # otherwise: the library doesn't exist), and Ember gets as far as refusing --inspect (exit 2). Only where SIP is
          # on, as on users' Macs: these runners report it off, and with it off dyld may honour DYLD_* for any binary, so
          # the line would prove nothing here.
          if [[ "$(csrutil status 2>&1)" == *"status: enabled"* ]]; then
            status=0
            DYLD_INSERT_LIBRARIES=/nonexistent/ember-dyld-check.dylib "$exe" --inspect=127.0.0.1:9229 || status=$?
            test "$status" -eq 2
          else
            echo "::notice::SIP is off on this runner: the DYLD_* check can't prove anything here"
          fi
          # Node mode is refused (review #177: RunAsNode is off on macOS). Given ELECTRON_RUN_AS_NODE=1, Ember's binary
          # still starts as Ember, which stops at once on --inspect (exit 2, its message), and never runs the script it
          # is given, which would leave the mark.
          mark="$RUNNER_TEMP/ember-node-mode-mark"
          echo 'require("fs").writeFileSync(process.env.EMBER_MARK, "node mode")' > "$RUNNER_TEMP/ember-node-mode.js"
          rm -f "$mark"
          node -e 'const r = require("child_process").spawnSync(process.argv[1], ["--inspect=127.0.0.1:9229", process.argv[2]], { encoding: "utf8", timeout: 60000, env: { ...process.env, ELECTRON_RUN_AS_NODE: "1", EMBER_MARK: process.argv[3] } }); console.log(r.stdout + r.stderr + "\nexit " + r.status)' "$exe" "$RUNNER_TEMP/ember-node-mode.js" "$mark" > node-mode.log
          if [ -e "$mark" ] || ! grep -q "doesn't start with debugging switches" node-mode.log || ! grep -qx 'exit 2' node-mode.log; then cat node-mode.log; exit 1; fi
          echo "Node mode refused: Ember started as itself, refused --inspect (exit 2) and left no mark"
          # NODE_OPTIONS: a packaged Electron drops all but two NODE_OPTIONS in app mode (and in its utility processes)
          # whatever the fuse says, and node mode is refused, so no run can show the fuse here. `fuses.mjs --check` above
          # (EnableNodeOptionsEnvironmentVariable off) is the proof. This run only shows that --inspect is still refused
          # with it set.
          node -e 'const r = require("child_process").spawnSync(process.argv[1], ["--inspect=127.0.0.1:9229"], { encoding: "utf8", timeout: 60000, env: { ...process.env, NODE_OPTIONS: "--require=/nonexistent/ember-fuse-check.js" } }); console.log(r.stdout + r.stderr + "\nexit " + r.status)' "$exe" > inspect.log
          if grep -q 'Debugger listening' inspect.log; then cat inspect.log; exit 1; fi
          if ! grep -q "doesn't start with debugging switches" inspect.log || ! grep -qx 'exit 2' inspect.log; then cat inspect.log; exit 1; fi
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = io.github.komaladitya08.ember
          test "$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")" = Ember && test ! -e "$app/Contents/MacOS/Electron"
          plutil -extract NSMicrophoneUsageDescription raw -o - "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/THIRD_PARTY_NOTICES" && test -f "$app/Contents/Resources/LICENSES.chromium.html" && test -f "$app/Contents/Resources/LICENSE"
          test -f "$app/Contents/Resources/ember.icns" && test ! -e "$app/Contents/Resources/default_app.asar"
          test ! -e "$app/Contents/Resources/app/dist/app/desk-agent.cjs"
          test -f "$app/Contents/Resources/app/dist/app/ax-sidecar.cjs"
      - name: The packaged Ember.app starts and shows its window on Intel
        run: node test/smoke/launch.mjs --exe dist/package/Ember.app/Contents/MacOS/Ember
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: (github.event_name == 'workflow_dispatch' && inputs.packages) || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        with:
          name: ember-macos-x64
          path: |
            dist/package/*.zip
            dist/package/*.dmg
          retention-days: 3

  release:
    name: Publish the release (v* tags, after every other job passed)
    # docs/DEVELOPING.md §15. Only a v* tag gets here, and only once every platform's checks and packages are green.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, el8, package, eval, windows, macos, macos-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: "Release files: ember-packages"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ember-packages
          path: dist/release
      - name: "Release files: ember-windows"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ember-windows
          path: dist/release
      - name: "Release files: ember-macos"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ember-macos
          path: dist/release
      - name: "Release files: ember-macos-x64"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ember-macos-x64
          path: dist/release
      - name: The files the README downloads, the tag's version, and the notes from CHANGELOG.md
        run: |
          ls -l dist/release
          node scripts/package/release.mjs dist/release "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" dist/release-notes.md
      - name: SHA256SUMS
        working-directory: dist/release
        run: |
          sha256sum ember-*.rpm Ember-*.AppImage Ember-*.zip Ember-*.dmg > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish the release with its files and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Ember $v" --notes-file dist/release-notes.md dist/release/*
