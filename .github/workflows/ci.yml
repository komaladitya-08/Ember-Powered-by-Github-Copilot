name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Accessibility sidecar self-test (stand-in pyatspi, no desktop)
        run: npm run test:sidecar
      - name: Speech models (cached; verified by SHA-256)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/voice
          key: voice-${{ hashFiles('app/voice/models.ts', 'scripts/voice/prepare.mjs') }}
      - run: node scripts/voice/prepare.mjs
      - name: Integration tests (real Copilot runtime with an offline mock model; real speech models)
        run: npm run test:integration
        env:
          EMBER_VOICE_TEST: "1"
      - run: npm run build
      - run: npm run build:lab

  el8:
    name: RHEL 8 compatibility (rockylinux:8)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: rockylinux:8
      # Lets Chromium use its user-namespace sandbox inside the container.
      options: --security-opt seccomp=unconfined
    steps:
      - name: System packages (build tools, Electron runtime libraries, Xvfb)
        run: |
          dnf -y -q install git tar xz file binutils findutils which sudo gcc-c++ make python3 \
            libX11-devel libXtst-devel libXt-devel \
            gtk3 nss alsa-lib mesa-libgbm libdrm libxkbcommon at-spi2-core at-spi2-atk cups-libs \
            libXtst libXrandr libXcomposite libXdamage \
            xorg-x11-server-Xvfb xorg-x11-xauth dbus-x11 mesa-dri-drivers dejavu-sans-fonts \
            python3-pyatspi python3-gobject
          useradd -m ci
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Rebuild native modules on glibc 2.28 and check every binary
        run: scripts/rebuild-el8.sh --here
      - name: Accessibility sidecar self-test on RHEL 8's platform-python (3.6), which installed Ember runs it with
        run: /usr/libexec/platform-python -B sidecar/atspi/test_ember_atspi.py
      - run: npm run build
      - name: Launch smoke test as a normal user (sandbox on)
        run: |
          chown -R ci .
          sudo -u ci env "PATH=$PATH" HOME=/home/ci xvfb-run -a npm run test:smoke
      - name: Screen reading and acting on RHEL 8's Python 3.6 (AT-SPI sidecar, a worker against a GTK3 window, Ember's desk, hostile windows, Electron windows and their secret fields, a click that runs a modal dialog)
        run: |
          sudo -u ci env "PATH=$PATH" HOME=/home/ci EMBER_ATSPI_TEST=1 \
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" npm run test:integration -- test/integration/perception.test.ts test/integration/worker.test.ts test/integration/desk.test.ts test/integration/safety.test.ts test/integration/perception-electron.test.ts test/integration/action-link.test.ts test/integration/keybuffer-live.test.ts test/integration/overlay-shape-live.test.ts

  package:
    name: Package (RPM, AppImage) and install on rockylinux:8
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: rockylinux:8
      options: --security-opt seccomp=unconfined
    steps:
      - name: Build tools only (the RPM must bring in its own runtime dependencies)
        run: |
          dnf -y -q install git tar xz file binutils findutils which sudo gcc-c++ make python3 rpm-build \
            libX11-devel libXtst-devel libXt-devel xorg-x11-server-Xvfb xorg-x11-xauth dbus-x11 mesa-dri-drivers dejavu-sans-fonts
          useradd -m ci
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Rebuild native modules on glibc 2.28
        run: scripts/rebuild-el8.sh --here
      - run: npm run build
      - name: Stage the app and check every binary against RHEL 8.4's glibc
        run: |
          node scripts/package/stage.mjs
          scripts/check-symvers.sh dist/package/ember | grep -v '^ok' || true
          scripts/check-symvers.sh dist/package/ember > /dev/null
      - name: Build the RPM
        run: scripts/package/rpm.sh
      - name: Build the AppImage
        run: scripts/package/appimage.sh
      - name: Install the RPM with dnf (resolves every Requires from the distribution)
        run: |
          dnf -y install ./dist/package/ember-*.x86_64.rpm
          rpm -q --requires ember | grep -v rpmlib
          stat -c '%A %U %n' /opt/ember/chrome-sandbox | grep -q '^-rwsr-xr-x root'
          test -x /usr/bin/ember && test -f /usr/share/applications/ember.desktop
          # The desk helper ships beside main.cjs, and the installed binary can run it as plain Node.
          test -f /opt/ember/resources/app/dist/app/desk-agent.cjs
          ELECTRON_RUN_AS_NODE=1 /opt/ember/ember -e 'process.exit(0)'
      - name: "The installed Ember's fuses: no debugger, no NODE_OPTIONS; plain Node kept for the desk helper"
        run: |
          node scripts/package/fuses.mjs --check /opt/ember/ember
          # NODE_OPTIONS is ignored, also when Ember runs its desk helper as plain Node.
          ELECTRON_RUN_AS_NODE=1 NODE_OPTIONS=--require=/nonexistent/ember-fuse-check.js /opt/ember/ember -e 'process.exit(0)'
          # --inspect opens no debugger (and an installed Ember refuses to start with it).
          sudo -u ci env HOME=/home/ci xvfb-run -a sh -c 'timeout 25 ember --inspect=127.0.0.1:9229 > /tmp/inspect.log 2>&1; true'
          if grep -q 'Debugger listening' /tmp/inspect.log; then cat /tmp/inspect.log; exit 1; fi
          grep -q "doesn't start with debugging switches" /tmp/inspect.log || { cat /tmp/inspect.log; exit 1; }
      - name: The bundled licences are installed, and marked as licence files
        run: |
          test -s /opt/ember/THIRD_PARTY_NOTICES
          rpm -qL ember | grep -qx /opt/ember/THIRD_PARTY_NOTICES
          rpm -qL ember | grep -q 'sharp-libvips-linux-x64/README.md$'
          rpm -ql ember | grep -qx /usr/share/doc/ember
      - name: ember doctor (no display, then on a display)
        run: |
          sudo -u ci env HOME=/home/ci ember doctor || true
          # Without a display the check-up starts no GPU, so Chromium prints no GL errors over the report.
          if { sudo -u ci env HOME=/home/ci ember doctor 2>&1 || true; } | grep -E 'ANGLE|eglInitialize|GPU process'; then exit 1; fi
          sudo -u ci env HOME=/home/ci xvfb-run -a ember doctor || true
          sudo -u ci env HOME=/home/ci xvfb-run -a ember doctor | grep -q 'ok    Sandbox'
      - name: The installed Ember starts and shows its window (as a normal user)
        run: |
          sudo -u ci env HOME=/home/ci EMBER_LOG_STDOUT=1 xvfb-run -a sh -c 'timeout 25 ember > /tmp/ember.log 2>&1; true'
          grep -q '"msg":"window.home.shown"' /tmp/ember.log || { cat /tmp/ember.log; exit 1; }
      - name: "STIG-like host (user namespaces off): the setuid sandbox helper is in place"
        # The container can't turn off the host's user namespaces; this checks what Chromium falls back to.
        run: stat -c '%a %U' /opt/ember/chrome-sandbox | grep -qx '4755 root'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: ember-packages
          path: |
            dist/package/*.rpm
            dist/package/*.AppImage
          retention-days: 14

  eval:
    name: Evaluation (task suite and release gates, rockylinux:8)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: rockylinux:8
      options: --security-opt seccomp=unconfined
    steps:
      - name: System packages (as el8, plus gedit and dconf for the task suite)
        run: |
          dnf -y -q install git tar xz bzip2 file binutils findutils which sudo gcc-c++ make python3 \
            libX11-devel libXtst-devel libXt-devel \
            gtk3 nss alsa-lib mesa-libgbm libdrm libxkbcommon at-spi2-core at-spi2-atk cups-libs \
            libXtst libXrandr libXcomposite libXdamage \
            xorg-x11-server-Xvfb xorg-x11-xauth dbus-x11 mesa-dri-drivers dejavu-sans-fonts \
            python3-pyatspi python3-gobject gedit dconf gsettings-desktop-schemas
          useradd -m ci
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Rebuild native modules on glibc 2.28
        run: scripts/rebuild-el8.sh --here
      - name: Speech models (cached; verified by SHA-256)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/voice
          key: voice-${{ hashFiles('app/voice/models.ts', 'scripts/voice/prepare.mjs') }}
      - run: node scripts/voice/prepare.mjs
      - name: Task suite (scripted model) and release gates, as a normal user
        run: |
          chown -R ci .
          sudo -u ci env "PATH=$PATH" HOME=/home/ci \
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x1024x24" node eval/run.mjs --out dist/eval
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        continue-on-error: true
        with:
          name: ember-eval
          path: dist/eval/
          retention-days: 30

  windows:
    name: Windows (unit tests, build, smoke, UI Automation, zip)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash with -eo pipefail: any failing command fails the step (pwsh would check only the last one).
        shell: bash
    steps:
      - name: Keep LF line endings in the checkout (as .gitattributes says)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The UI Automation bridge compiles with Windows PowerShell 5.1's C# 5 compiler, as Ember runs it
        if: hashFiles('sidecar/uia/ember_uia.cs') != ''
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "this must be Windows PowerShell 5.1, not $($PSVersionTable.PSVersion)" }
          Add-Type -Path sidecar/uia/ember_uia.cs -ReferencedAssemblies UIAutomationClient,UIAutomationTypes,WindowsBase,System.Web.Extensions
          "compiled sidecar/uia/ember_uia.cs with PowerShell $($PSVersionTable.PSVersion)"
      - name: Launch smoke test (development build)
        run: npm run test:smoke
      - name: Desktop integration tests (window system and input, UI Automation bridge, accessibility host)
        # TODO(port): drop --allow-missing once the win32, uia and host packages have added these files.
        run: node scripts/run-integration.mjs --allow-missing test/integration/win32-desktop.test.ts test/integration/uia-bridge.test.ts test/integration/ax-sidecar.test.ts
        env:
          EMBER_WIN32_TEST: "1"
          EMBER_UIA_TEST: "1"
      - name: Stage Ember and zip it
        # TODO(port): drop --allow-missing-sidecar once dist/app/ax-sidecar.cjs (host package) and sidecar/uia (uia
        # package) exist; without the flag stage.mjs refuses to stage an Ember that can't read apps.
        run: |
          node scripts/package/stage.mjs --allow-missing-sidecar
          node scripts/package/archive.mjs
      - name: "The packaged Ember: its fuses, plain Node kept, NODE_OPTIONS ignored, --inspect refused, its files"
        run: |
          app=dist/package/Ember
          export EMBER_USER_DATA="$RUNNER_TEMP/ember-checks"
          node scripts/package/fuses.mjs --check "$app/Ember.exe"
          # The accessibility host runs as Ember.exe in node mode; NODE_OPTIONS is ignored there too.
          ELECTRON_RUN_AS_NODE=1 "$app/Ember.exe" -e "process.exit(0)"
          ELECTRON_RUN_AS_NODE=1 NODE_OPTIONS=--require=C:/nonexistent/ember-fuse-check.js "$app/Ember.exe" -e "process.exit(0)"
          # --inspect opens no debugger, and a packaged Ember refuses to start with it (exit 2).
          node -e 'const r = require("child_process").spawnSync(process.argv[1], ["--inspect=127.0.0.1:9229"], { encoding: "utf8", timeout: 60000 }); console.log(r.stdout + r.stderr + "exit " + r.status)' "$app/Ember.exe" > inspect.log
          if grep -q 'Debugger listening' inspect.log; then cat inspect.log; exit 1; fi
          if ! grep -q "doesn't start with debugging switches" inspect.log || ! grep -qx 'exit 2' inspect.log; then cat inspect.log; exit 1; fi
          test -s "$app/THIRD_PARTY_NOTICES" && test -f "$app/LICENSES.chromium.html" && test -f "$app/LICENSE"
          test -f "$app/resources/ember.ico" && test ! -e "$app/resources/default_app.asar"
          test ! -e "$app/resources/app/dist/app/desk-agent.cjs"
          if [ -f dist/app/ax-sidecar.cjs ]; then test -f "$app/resources/app/dist/app/ax-sidecar.cjs"; fi
          if [ -f sidecar/uia/ember_uia.cs ]; then test -f "$app/resources/sidecar/uia/ember_uia.ps1" && test -f "$app/resources/sidecar/uia/ember_uia.cs"; fi
      - name: The packaged Ember starts and shows its window
        run: node test/smoke/launch.mjs --exe dist/package/Ember/Ember.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: ember-windows
          path: dist/package/*.zip
          retention-days: 14

  macos:
    name: macOS (unit tests, build, smoke, accessibility, app bundle)
    # Kept lean: macOS minutes cost ten times Linux's on a private repository.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Launch smoke test (development build)
        run: npm run test:smoke
      - name: Grant Accessibility and Screen Recording to every process that may be TCC's responsible one
        # The runner's TCC database is writable with sudo (SIP covers only /System). Which process macOS holds
        # responsible for a CI job isn't certain, so every candidate is granted; the tests print
        # AXIsProcessTrusted() and fail loudly without it.
        run: |
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          node_bin=$(command -v node)
          clients=(
            "$GITHUB_WORKSPACE/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron"
            "$GITHUB_WORKSPACE/dist/package/Ember.app/Contents/MacOS/Electron"
            "$node_bin" "$(realpath "$node_bin")" /bin/bash /bin/zsh
          )
          # The runner's own processes, from this shell up to launchd.
          pid=$$
          while [ "${pid:-1}" -gt 1 ]; do
            comm=$(ps -o comm= -p "$pid" || true)
            case "$comm" in /*) clients+=("$comm") ;; esac
            pid=$(ps -o ppid= -p "$pid" | tr -d ' ' || true)
          done
          now=$(date +%s)
          printf '%s\n' "${clients[@]}" | sort -u | while IFS= read -r client; do
            for service in kTCCServiceAccessibility kTCCServiceScreenCapture; do
              sudo sqlite3 "$db" "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) VALUES('$service','$client',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$now);"
            done
            echo "granted Accessibility and Screen Recording: $client"
          done
          sudo launchctl stop com.apple.tccd || true
          sleep 2
          sudo sqlite3 "$db" "SELECT service, client, auth_value FROM access WHERE service IN ('kTCCServiceAccessibility', 'kTCCServiceScreenCapture');"
      - name: Desktop integration tests (window system and input, accessibility host)
        # TODO(port): drop --allow-missing once the darwin and host packages have added these files.
        run: node scripts/run-integration.mjs --allow-missing test/integration/darwin-desktop.test.ts test/integration/ax-sidecar.test.ts
        env:
          EMBER_DARWIN_TEST: "1"
          EMBER_AX_TEST: "1"
      - name: Stage Ember.app (signed ad hoc), zip it and make the disk image
        # TODO(port): drop --allow-missing-sidecar once dist/app/ax-sidecar.cjs (host package) exists; without the
        # flag stage.mjs refuses to stage an Ember that can't read apps.
        run: |
          node scripts/package/stage.mjs --allow-missing-sidecar
          node scripts/package/archive.mjs
      - name: "The packaged Ember.app: its fuses, its signature, plain Node kept, NODE_OPTIONS ignored, --inspect refused"
        run: |
          app=dist/package/Ember.app
          exe="$app/Contents/MacOS/Electron"
          export EMBER_USER_DATA="$RUNNER_TEMP/ember-checks"
          node scripts/package/fuses.mjs --check "$app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          codesign --verify --deep --strict --verbose=2 "$app"
          # The accessibility host runs as Ember's binary in node mode; NODE_OPTIONS is ignored there too.
          ELECTRON_RUN_AS_NODE=1 "$exe" -e 'process.exit(0)'
          ELECTRON_RUN_AS_NODE=1 NODE_OPTIONS=--require=/nonexistent/ember-fuse-check.js "$exe" -e 'process.exit(0)'
          # --inspect opens no debugger, and a packaged Ember refuses to start with it (exit 2).
          node -e 'const r = require("child_process").spawnSync(process.argv[1], ["--inspect=127.0.0.1:9229"], { encoding: "utf8", timeout: 60000 }); console.log(r.stdout + r.stderr + "exit " + r.status)' "$exe" > inspect.log
          if grep -q 'Debugger listening' inspect.log; then cat inspect.log; exit 1; fi
          if ! grep -q "doesn't start with debugging switches" inspect.log || ! grep -qx 'exit 2' inspect.log; then cat inspect.log; exit 1; fi
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = io.github.komaladitya08.ember
          plutil -extract NSMicrophoneUsageDescription raw -o - "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/THIRD_PARTY_NOTICES" && test -f "$app/Contents/Resources/LICENSES.chromium.html" && test -f "$app/Contents/Resources/LICENSE"
          test -f "$app/Contents/Resources/ember.icns" && test ! -e "$app/Contents/Resources/default_app.asar"
          test ! -e "$app/Contents/Resources/app/dist/app/desk-agent.cjs"
          if [ -f dist/app/ax-sidecar.cjs ]; then test -f "$app/Contents/Resources/app/dist/app/ax-sidecar.cjs"; fi
      - name: The packaged Ember.app starts and shows its window
        run: node test/smoke/launch.mjs --exe dist/package/Ember.app/Contents/MacOS/Electron
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: ember-macos
          path: |
            dist/package/*.zip
            dist/package/*.dmg
          retention-days: 14
